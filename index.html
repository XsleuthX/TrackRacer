<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Heat: Pedal to the Metal</title>
<style>
/* ═══════════════════════════════════════════
   DESIGN TOKENS — Warm Racing Palette
═══════════════════════════════════════════ */
:root {
  --bg:        #0e0b09;
  --bg2:       #17120f;
  --bg3:       #1f1710;
  --panel:     rgba(26,19,13,.92);
  --panel2:    rgba(32,24,16,.85);
  --border:    rgba(255,200,120,.10);
  --border2:   rgba(255,200,120,.18);
  --text:      #f0ece3;
  --muted:     #a09080;
  --muted2:    #6a5a4a;

  /* Accent colors */
  --gold:      #e8b84b;
  --gold2:     rgba(232,184,75,.18);
  --heat:      #e84b3a;
  --heat2:     rgba(232,75,58,.20);
  --cool:      #4be8a0;
  --cool2:     rgba(75,232,160,.18);
  --slip:      #4ba8e8;
  --slip2:     rgba(75,168,232,.18);
  --stress:    #b04be8;
  --stress2:   rgba(176,75,232,.18);
  --warn:      #e8904b;
  --warn2:     rgba(232,144,75,.18);

  /* Phase colors */
  --phase-plan:    #4be8a0;
  --phase-resolve: #e8b84b;
  --phase-corner:  #e84b3a;
  --phase-done:    #b04be8;

  --radius:    12px;
  --radius-sm: 8px;
  --radius-lg: 18px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.4;
  overflow-x: hidden;
}

/* ═══════════════════════════════════════════
   SCROLLBAR
═══════════════════════════════════════════ */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

/* ═══════════════════════════════════════════
   HEADER / TELEMETRY BAR
═══════════════════════════════════════════ */
#header {
  position: sticky; top: 0; z-index: 80;
  display: flex; align-items: center; gap: 10px;
  padding: 0 12px;
  height: 52px;
  background: rgba(14,11,9,.95);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
}
#header .brand {
  font-size: 13px; font-weight: 700;
  color: var(--gold);
  letter-spacing: .5px;
  white-space: nowrap;
  display: flex; align-items: center; gap: 8px;
}
#header .brand svg { width: 22px; height: 22px; flex-shrink: 0; }
#header .sep { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }
#header .center { display: flex; gap: 8px; align-items: center; flex: 1; flex-wrap: wrap; }
#header .right { display: flex; gap: 6px; align-items: center; margin-left: auto; flex-shrink: 0; }

/* Phase pill */
.phase-pill {
  font-size: 11px; font-weight: 700; letter-spacing: .6px;
  padding: 4px 10px; border-radius: 20px;
  border: 1px solid;
  transition: all .25s;
}
.phase-pill.setup    { color: var(--muted);       border-color: var(--border);  background: rgba(255,255,255,.04); }
.phase-pill.planning { color: var(--phase-plan);   border-color: rgba(75,232,160,.3); background: rgba(75,232,160,.08); }
.phase-pill.resolving{ color: var(--phase-resolve); border-color: rgba(232,184,75,.3); background: rgba(232,184,75,.08); }
.phase-pill.corner   { color: var(--phase-corner); border-color: rgba(232,75,58,.3); background: rgba(232,75,58,.1); }
.phase-pill.finished { color: var(--phase-done);  border-color: rgba(176,75,232,.3); background: rgba(176,75,232,.08); }

/* Info chips */
.chip {
  font-size: 11px; color: var(--muted);
  padding: 3px 8px; border-radius: 6px;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border);
  white-space: nowrap;
}

/* Buttons */
.btn {
  cursor: pointer;
  font-size: 12px; font-weight: 600;
  padding: 6px 12px; border-radius: 8px;
  border: 1px solid var(--border2);
  background: rgba(255,255,255,.04);
  color: var(--text);
  transition: background .15s, border-color .15s, transform .08s;
  white-space: nowrap;
}
.btn:hover { background: rgba(255,255,255,.08); border-color: rgba(255,200,120,.28); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

.btn.primary {
  background: var(--gold2); border-color: rgba(232,184,75,.45);
  color: var(--gold); font-weight: 700;
}
.btn.primary:hover { background: rgba(232,184,75,.28); }

.btn.danger {
  background: var(--heat2); border-color: rgba(232,75,58,.4);
  color: var(--heat);
}
.btn.danger:hover { background: rgba(232,75,58,.3); }

.btn.success {
  background: var(--cool2); border-color: rgba(75,232,160,.4);
  color: var(--cool);
}
.btn.success:hover { background: rgba(75,232,160,.28); }

.btn.slip-btn {
  background: var(--slip2); border-color: rgba(75,168,232,.4);
  color: var(--slip);
}
.btn.cta {
  font-size: 13px; font-weight: 700;
  padding: 9px 18px; border-radius: 10px;
}

/* ═══════════════════════════════════════════
   APP LAYOUT
═══════════════════════════════════════════ */
#app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 8px 360px;
  grid-template-rows: auto 1fr;
  height: calc(100vh - 52px);
  gap: 0;
}

/* ═══════════════════════════════════════════
   TRACK PANEL (left primary)
═══════════════════════════════════════════ */
#trackPanel {
  grid-column: 1;
  grid-row: 1 / 3;
  display: flex; flex-direction: column;
  border-right: 1px solid var(--border);
  overflow: hidden;
}

#panelSplitter {
  grid-column: 2;
  grid-row: 1 / 3;
  cursor: col-resize;
  touch-action: none;
  background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.08), rgba(255,255,255,.02));
  border-left: 1px solid rgba(255,255,255,.03);
  border-right: 1px solid rgba(0,0,0,.35);
}
#panelSplitter:hover, #panelSplitter.dragging { background: linear-gradient(180deg, rgba(232,184,75,.16), rgba(232,184,75,.28), rgba(232,184,75,.16)); }
#rightPanel { grid-column: 3; }
#trackToolbar {
  display: flex; gap: 8px; align-items: center;
  padding: 10px 14px;
  background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}

#actionDockWrap {
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(20,15,11,.96), rgba(14,11,9,.98));
}
#footerSplitter {
  height: 12px;
  cursor: row-resize;
  touch-action: none;
  background: linear-gradient(90deg, rgba(255,255,255,.02), rgba(255,255,255,.08), rgba(255,255,255,.02));
  border-top: 1px solid rgba(255,255,255,.03);
  border-bottom: 1px solid rgba(0,0,0,.35);
}
#footerSplitter:hover, #footerSplitter.dragging { background: linear-gradient(90deg, rgba(232,184,75,.16), rgba(232,184,75,.28), rgba(232,184,75,.16)); }
#trackView {
  flex: 1;
  position: relative;
  overflow: auto;
  background: radial-gradient(ellipse at 50% 40%, rgba(232,184,75,.04) 0%, transparent 70%), var(--bg);
}
.trackCanvas {
  width: 100%; height: 520px;
  display: block;
  background:
    radial-gradient(1200px 600px at 70% 60%, rgba(255,255,255,.03), transparent 60%),
    linear-gradient(135deg, rgba(232,144,75,.07), rgba(232,75,58,.04)),
    repeating-linear-gradient(0deg, rgba(255,200,120,.03) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(90deg, rgba(255,200,120,.03) 0 1px, transparent 1px 28px),
    #100d0a;
}
.trackGrid {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: var(--spaceW, 100px);
  gap: 8px; padding: 12px;
  align-items: start;
  min-height: 420px;
}

/* Track tokens strip */
.trackTokens {
  position: sticky; top: 0; z-index: 5;
  margin: 0 0 6px 0;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: rgba(16,13,10,.82);
  backdrop-filter: blur(6px);
}

/* Space cells (strip mode) */
.space {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: rgba(255,255,255,.02);
  padding: 8px;
  display: flex; flex-direction: column; gap: 6px;
  min-height: 120px; position: relative;
  transition: border-color .15s;
}
.space .idx { font-size: 10px; color: var(--muted2); display: flex; justify-content: space-between; gap: 4px; }
.spots { display: grid; grid-template-rows: 1fr 1fr; gap: 5px; flex: 1; }
.spots.one { grid-template-rows: 1fr; }
.spot {
  border: 1px dashed rgba(160,144,128,.25);
  border-radius: 10px; min-height: 38px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.01);
}
.spot.raceline { border-style: solid; border-color: rgba(232,184,75,.2); }

/* Car tokens */
.car {
  position: relative;
  width: 46px; height: 18px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 8px; letter-spacing: .2px;
  color: rgba(255,255,255,.95);
  text-shadow: 0 1px 2px rgba(0,0,0,.55);
  border: 1px solid rgba(255,255,255,.35);
  background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.02));
  clip-path: polygon(4% 18%, 18% 18%, 26% 0%, 78% 0%, 86% 18%, 96% 18%, 96% 38%, 84% 38%, 73% 100%, 27% 100%, 16% 38%, 4% 38%);
  box-shadow: 0 8px 18px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.24);
  transition: box-shadow .15s, transform .12s;
}
.car::before {
  content: "";
  position: absolute;
  left: 14px; top: 3px;
  width: 17px; height: 8px;
  border-radius: 7px 7px 4px 4px;
  background: rgba(18,18,18,.52);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.16);
}
.car::after {
  content: "";
  position: absolute;
  right: -1px; top: 6px;
  width: 11px; height: 4px;
  border-radius: 2px;
  background: rgba(255,255,255,.26);
}
.car.active-car {
  box-shadow: 0 0 0 2px var(--gold), 0 8px 18px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.24);
  transform: translateY(-1px);
}
.car.ai {
  filter: saturate(.85) brightness(.92);
}
.car.ai .car-label, .car .car-label {
  position: relative;
  z-index: 2;
}
.carWrap { position: relative; display: flex; align-items: center; justify-content: center; min-height: 30px; }
.carWrap.ai-tag::after {
  content: "AI"; position: absolute; bottom: -12px;
  font-size: 9px; font-weight: 700; color: var(--muted);
}

/* Space badges */
.badge {
  font-size: 10px; font-weight: 600;
  padding: 2px 7px; border-radius: 12px;
  border: 1px solid;
}
.badge.finish { border-color: rgba(75,232,160,.4); background: rgba(75,232,160,.1); color: #a0ffd8; }
.badge.corner { border-color: rgba(232,184,75,.4); background: rgba(232,184,75,.1); color: #ffe7a0; }
.badge.press  { border-color: rgba(232,75,176,.35); background: rgba(232,75,176,.1); color: #ffb0e8; }
.badge.road   { border-color: rgba(232,144,75,.35); background: rgba(232,144,75,.1); color: #ffd4a0; }
.badge.sector { border-color: rgba(75,168,232,.33); background: rgba(75,168,232,.1); color: #c0e4ff; }

/* ═══════════════════════════════════════════
   RIGHT PANEL — Phase-aware game panel
═══════════════════════════════════════════ */
#rightPanel {
  grid-row: 1 / 3;
  display: flex; flex-direction: column;
  overflow: hidden;
  background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.015));
}
#rightPanelInner {
  flex: 1; overflow-y: auto;
  padding: 16px;
  display: flex; flex-direction: column; gap: 14px;
  background: radial-gradient(circle at top right, rgba(232,184,75,.08), transparent 36%);
}

/* ═══════════════════════════════════════════
   LOG PANEL (bottom right)
═══════════════════════════════════════════ */
#logPanel {
  display: flex; flex-direction: column;
  min-height: 0;
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: 0 10px 26px rgba(0,0,0,.24);
}
#logHeader {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 12px;
  background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
  border-bottom: 1px solid var(--border);
  font-size: 11px; font-weight: 700; color: var(--muted);
  letter-spacing: .5px;
  flex-shrink: 0;
}
.log {
  flex: 1; overflow-y: auto;
  padding: 8px 12px;
  background: rgba(10,8,6,.6);
}
.log .item {
  font-size: 11px; color: var(--muted); margin: 0 0 5px 0;
  line-height: 1.5;
  border-left: 2px solid transparent;
  padding-left: 6px;
}
.log .item.recent { border-left-color: var(--gold); color: rgba(240,236,227,.6); }
.log .item strong { color: var(--gold); }

/* ═══════════════════════════════════════════
   GAME PANELS — Shared Components
═══════════════════════════════════════════ */
.pane {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.pane-hd {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  font-size: 12px; font-weight: 700;
  color: var(--muted);
  letter-spacing: .4px;
  display: flex; align-items: center; justify-content: space-between;
}
.pane-bd { padding: 10px 12px; }

.hr { height: 1px; background: var(--border); margin: 8px 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.grid4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.tiny  { font-size: 11px; }
.bold  { font-weight: 700; }

/* Stat tiles */
.stat-tile {
  background: rgba(255,255,255,.03);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  display: flex; flex-direction: column; gap: 3px;
}
.stat-tile .label { font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: .4px; text-transform: uppercase; }
.stat-tile .value { font-size: 20px; font-weight: 800; color: var(--text); letter-spacing: -.3px; }
.stat-tile .sub   { font-size: 11px; color: var(--muted); }

/* Note blocks */
.note {
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,.02);
}

/* Inline tags */
.tag {
  display: inline-block;
  font-size: 10px; font-weight: 700; letter-spacing: .4px;
  padding: 2px 7px; border-radius: 8px;
  border: 1px solid var(--border2);
  background: rgba(255,255,255,.04);
  color: var(--muted);
}
.tag.heat-tag   { color: var(--heat); background: var(--heat2); border-color: rgba(232,75,58,.3); }
.tag.cool-tag   { color: var(--cool); background: var(--cool2); border-color: rgba(75,232,160,.3); }
.tag.gold-tag   { color: var(--gold); background: var(--gold2); border-color: rgba(232,184,75,.3); }
.tag.slip-tag   { color: var(--slip); background: var(--slip2); border-color: rgba(75,168,232,.3); }
.tag.stress-tag { color: var(--stress); background: var(--stress2); border-color: rgba(176,75,232,.3); }

/* ═══════════════════════════════════════════
   PLAYER HUD — Active driver strip
═══════════════════════════════════════════ */
.player-hud {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  display: flex; flex-direction: column; gap: 8px;
}
.player-hud .driver-row {
  display: flex; align-items: center; gap: 10px;
}
.driver-swatch {
  width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 13px;
  border: 2px solid rgba(255,255,255,.2);
  flex-shrink: 0;
}
.driver-info .name { font-size: 14px; font-weight: 700; }
.driver-info .sub  { font-size: 11px; color: var(--muted); margin-top: 1px; }

/* Gear ring */
.gear-ring-wrap { display: flex; align-items: center; gap: 10px; margin-top: 2px; }
.gear-ring {
  position: relative; width: 44px; height: 44px;
  flex-shrink: 0;
}
.gear-ring canvas { width: 44px; height: 44px; }
.gear-ring .gear-label {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 900; color: var(--text);
  letter-spacing: -.5px;
}
.gear-meta { display: flex; flex-direction: column; gap: 3px; }
.gear-meta .gear-name { font-size: 11px; color: var(--muted); }
.gear-meta .gear-target { font-size: 12px; color: var(--text); }

/* Heat engine pips */
.heat-row { display: flex; flex-direction: column; gap: 4px; }
.heat-row .heat-label { font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: .4px; text-transform: uppercase; }
.heat-pips { display: flex; gap: 4px; flex-wrap: wrap; }
.heat-pip {
  width: 12px; height: 12px; border-radius: 50%;
  border: 1px solid rgba(232,75,58,.4);
  background: rgba(232,75,58,.1);
  transition: background .2s, border-color .2s, transform .15s;
}
.heat-pip.filled { background: var(--heat); border-color: rgba(255,120,100,.7); }
.heat-pip.hot    { background: #ff2210; border-color: #ff5040; box-shadow: 0 0 6px rgba(255,34,16,.4); }

/* ═══════════════════════════════════════════
   CARDS
═══════════════════════════════════════════ */
.hand { display: flex; flex-wrap: wrap; gap: 6px; }

.card {
  width: 72px; height: 100px;
  border-radius: var(--radius);
  border: 1px solid var(--border2);
  background: var(--bg3);
  padding: 8px 7px;
  display: flex; flex-direction: column; justify-content: space-between;
  cursor: pointer; user-select: none;
  position: relative;
  transition: transform .12s, border-color .12s, box-shadow .12s;
}
.card:hover:not(.disabled) {
  transform: translateY(-3px);
  border-color: rgba(232,184,75,.4);
  box-shadow: 0 6px 18px rgba(0,0,0,.4);
}
.card.disabled { opacity: .38; cursor: not-allowed; transform: none; }
.card.selected {
  border-color: var(--gold);
  box-shadow: 0 0 0 1px var(--gold), 0 4px 16px rgba(232,184,75,.25);
  transform: translateY(-4px);
}

/* Card type tints */
.card.type-heat     { background: linear-gradient(160deg, rgba(232,75,58,.14), var(--bg3) 60%); border-color: rgba(232,75,58,.3); }
.card.type-stress   { background: linear-gradient(160deg, rgba(176,75,232,.14), var(--bg3) 60%); border-color: rgba(176,75,232,.3); }
.card.type-upgrade  { background: linear-gradient(160deg, rgba(232,184,75,.12), var(--bg3) 60%); border-color: rgba(232,184,75,.25); }
.card.type-sponsor  { background: linear-gradient(160deg, rgba(75,168,232,.12), var(--bg3) 60%); border-color: rgba(75,168,232,.25); }

.card .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
.card .card-num {
  font-size: 26px; font-weight: 900;
  line-height: 1; letter-spacing: -1px;
  color: var(--text);
}
.card .card-type-badge {
  font-size: 9px; font-weight: 700; letter-spacing: .3px;
  text-shadow: 0 1px 2px rgba(0,0,0,.55);
  padding: 2px 5px; border-radius: 6px;
  background: rgba(255,255,255,.06);
  color: var(--muted);
}
.card.type-heat   .card-type-badge { color: var(--heat); background: var(--heat2); }
.card.type-stress .card-type-badge { color: var(--stress); background: var(--stress2); }
.card.type-upgrade .card-type-badge { color: var(--gold); background: var(--gold2); }
.card.type-sponsor .card-type-badge { color: var(--slip); background: var(--slip2); }

.card .card-bot { display: flex; justify-content: space-between; align-items: flex-end; }
.card .card-name {
  font-size: 9px; font-weight: 600; color: var(--muted);
  max-width: 42px; line-height: 1.2;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.card .card-sym { font-size: 14px; font-weight: 900; }
.card .card-sym.plus  { color: var(--stress); }
.card .card-sym.heat  { color: var(--heat); }
.card .card-sym.cool  { color: var(--cool); }
.card .card-sym.stress{ color: var(--stress); }
.card .card-art { width: 100%; height: 46px; border-radius: 6px; object-fit: cover; margin: 4px 0; }

/* ═══════════════════════════════════════════
   STANDINGS MINI-TABLE
═══════════════════════════════════════════ */
.standings { display: flex; flex-direction: column; gap: 4px; }
.standing-row {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 8px; border-radius: 8px;
  background: rgba(255,255,255,.02);
  border: 1px solid transparent;
  transition: border-color .15s;
  font-size: 12px;
}
.standing-row.active { border-color: var(--gold); background: rgba(232,184,75,.05); }
.standing-row.finished { opacity: .55; }
.standing-pos { font-size: 11px; font-weight: 700; color: var(--muted); width: 16px; text-align: center; }
.standing-swatch { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; }
.standing-name { flex: 1; font-weight: 600; }
.standing-meta { font-size: 11px; color: var(--muted); text-align: right; }

/* ═══════════════════════════════════════════
   STEP PROGRESS INDICATOR
═══════════════════════════════════════════ */
.step-track {
  display: flex; gap: 3px; align-items: center;
  padding: 8px 0;
}
.step-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--border2);
  flex-shrink: 0; transition: background .2s, transform .15s;
}
.step-dot.done   { background: rgba(75,232,160,.6); }
.step-dot.active { background: var(--gold); transform: scale(1.35); }
.step-label { font-size: 11px; color: var(--muted); margin-left: 4px; }

/* ═══════════════════════════════════════════
   FORM ELEMENTS
═══════════════════════════════════════════ */
input[type="text"], input[type="number"], input[type="password"], select, textarea {
  background: rgba(255,255,255,.04);
  color: var(--text);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 7px 10px;
  font-size: 13px;
  font-family: inherit;
  transition: border-color .15s;
  width: 100%;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: rgba(232,184,75,.4);
}
input[type="color"] { padding: 1px; border: 1px solid var(--border2); border-radius: 6px; width: 36px; height: 30px; background: none; cursor: pointer; }
input[type="range"] {
  -webkit-appearance: none; appearance: none;
  background: rgba(255,255,255,.08);
  height: 4px; border-radius: 2px;
  border: none; padding: 0;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--gold); cursor: pointer;
}
input[type="checkbox"] {
  width: 14px; height: 14px; cursor: pointer;
  accent-color: var(--gold);
}
label { font-size: 12px; display: flex; flex-direction: column; gap: 5px; color: var(--muted); }
label strong { color: var(--text); }
textarea { min-height: 120px; resize: vertical; }
select option { background: #1f1710; }
.kbd { font-family: ui-monospace, 'Cascadia Code', Menlo, monospace; font-size: 11px; color: #d4c090; }

/* ═══════════════════════════════════════════
   MARKET / DRAFT CARDS
═══════════════════════════════════════════ */
.market { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.cardBtn {
  cursor: pointer;
  background: rgba(255,255,255,.03);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px;
  text-align: left;
  transition: transform .08s, border-color .12s;
  color: var(--text);
}

.cardBtn:hover { transform: translateY(-1px); border-color: rgba(232,184,75,.3); }
.cardBtn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.cardTitle { font-weight: 800; font-size: 12px; letter-spacing: .2px; color: var(--text); }
.cardBody  { font-size: 12px; color: rgba(240,236,227,.72); line-height: 1.3; margin-top: 4px; }

/* ═══════════════════════════════════════════
   MODAL
═══════════════════════════════════════════ */
.modalBack {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.72);
  display: none; align-items: center; justify-content: center;
  z-index: 200; backdrop-filter: blur(4px);
}
.modalBack.show { display: flex; }
.modal {
  width: min(1080px, 96vw);
  max-height: 88vh;
  overflow: auto;
  background: #1a130e;
  border: 1px solid var(--border2);
  border-radius: var(--radius-lg);
  box-shadow: 0 40px 100px rgba(0,0,0,.6);
}
.modal-hd {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);

}
.modal-bd { padding: 16px 18px; }

/* ═══════════════════════════════════════════
   TABLE
═══════════════════════════════════════════ */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { border-bottom: 1px solid var(--border); padding: 6px 8px; text-align: left; }
.tbl th { color: var(--muted); font-weight: 700; font-size: 11px; letter-spacing: .4px; }

/* ═══════════════════════════════════════════
   UPGRADE LIST (hand details)
═══════════════════════════════════════════ */
.upgList { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }

/* ═══════════════════════════════════════════

═══════════════════════════════════════════ */
#toastEl {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);

<script>
let _toastTimer = null;
function toast(msg) {
  clearTimeout(_toastTimer);
  var el = document.getElementById('toastEl');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  _toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
}

(() => {
  "use strict";

  /***********************
   * RNG (seeded)
   ***********************/
  function xmur3(str){
    let h = 1779033703 ^ str.length;
    for (let i=0;i<str.length;i++){
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return function(){
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      return (h ^= (h >>> 16)) >>> 0;
    }
  }
  function mulberry32(a){
    return function(){
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
  }

  /***********************
   * Utilities
   ***********************/
  const $ = (sel, root=document) => root.querySelector(sel);
  const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
  const deepClone = (obj) => JSON.parse(JSON.stringify(obj));

  function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }

  function uid(prefix="c"){
    return prefix + "_" + Math.random().toString(16).slice(2) + "_" + Date.now().toString(16);
  }

  function downloadText(filename, text, mime="text/plain"){
    const blob = new Blob([text], {type:mime});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  }

  function fmtCard(c){
    if (!c) return "—";
    if (c.type === 'basic') return `Basic ${c.value}`;
    if (c.type === 'upgrade') return c.name ? `U${c.upgNum||''} ${c.name} (${c.value})` : `Upgrade ${c.value}`;
    if (c.type === 'sponsor') return c.name ? `Sponsor ${c.choices?('[?]'):(c.value)} (${c.name})` : `Sponsor ${c.value}`;
    if (c.type === 'stress') return c.revealedCard ? `Stress (+→Basic ${c.revealedCard.value})` : `Stress (+)`;
    if (c.type === 'heat') return `Heat`;
    return c.type;
  }


  function cardTooltip(c){
    if (!c) return "—";
    let t = fmtCard(c);
    if (c.type === 'upgrade' || (c.type==='heat' && c.origin==='upgrade')){
      t += "\n" + upgradeCardFaceText(c);
    }
    if (c.type === 'sponsor'){
      t += "\n" + (c.desc || 'One-time sponsorship card. Removed after being played.');
      if (c.slipBonus) t += `\nSlipstream +${c.slipBonus}`;
      if (c.cool) t += `\nCooldown +${c.cool}`;
      if (c.limitMod) t += `\nCorner Limit +${c.limitMod}`;

  function renderUpgradeDetailsFromHand(hand){
    const upgs = (hand||[]).filter(c => c.type==='upgrade' || c.type==='sponsor' || (c.type==='heat' && c.origin==='upgrade'));
    if (!upgs.length) return '';
    function sponsorText(c){
      const lines = [];
      if (c.desc) lines.push(c.desc);
      if (c.slipBonus) lines.push(`Slipstream +${c.slipBonus} (this turn)`);
      if (c.limitMod) lines.push(`Corner Speed Limit +${c.limitMod} (this turn)`);
      if (c.cool) lines.push(`Cooldown +${c.cool} (optional)`);
      if (c.choices) lines.push(`Choose speed: ${c.choices.join('/')}`);
      return lines.join('\n');
    }
    return `
      <div class="note small" style="margin-top:10px">
        <strong>Special cards in hand</strong>
        <div class="small muted">Upgrade / Sponsorship reference (Advanced + Championship).</div>
        <div class="upgList">
          ${upgs.map(c=>{
            let title='', body='';
            if (c.type==='upgrade'){
              title = `U${c.upgNum} ${c.name}`;
              body = upgradeCardFaceText(c);
            } else if (c.type==='sponsor'){
              const v = c.choices ? `(${c.choices.join('/')})` : `(${c.value})`;
              title = `S ${c.name} ${v}`;
              body = sponsorText(c);
            } else {
              title = `Heat (Upgrade effect)`;
              body = 'This Heat card was created by an upgrade effect and clogs your hand like normal Heat.';
            }
            return `<div class="upgItem">
              <div style="font-weight:850">${escapeHtml(title)}</div>
              <pre class="upgDesc">${escapeHtml(body||'')}</pre>
            </div>`;
          }).join('')}
        </div>

    `;
  }

    const cards = [];
    for (let v=1; v<=4; v++){

    return [

  }

  function shuffleInPlace(arr, rngFn){
    const rf = (typeof rngFn === 'function') ? rngFn : (typeof rng === 'function' ? rng : Math.random);
    for (let i=arr.length-1;i>0;i--){
      const j = Math.floor(rf()*(i+1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  function normalizeTrack(t){
    const out = deepClone(t);
    out.spacesCount = clamp(parseInt(out.spacesCount||0,10), 10, 200);
    out.spotsPerSpace = (parseInt(out.spotsPerSpace||2,10) === 1) ? 1 : 2;
    out.finishIndex = clamp(parseInt(out.finishIndex||0,10), 0, out.spacesCount-1);
    out.lapsRequired = clamp(parseInt(out.lapsRequired||2,10), 1, 9);
    out.startGridStartIndex = clamp(parseInt(out.startGridStartIndex ?? 2,10), 0, out.spacesCount-1);
    out.corners = Array.isArray(out.corners) ? out.corners.map(c => {
      const cornerLineIndex = clamp(parseInt(c.cornerLineIndex||0,10), 0, out.spacesCount-1);
      const speedLimit = clamp(parseInt(c.speedLimit||0,10), 1, 20);
      const obj = { cornerLineIndex, speedLimit };
      if (c.legendsLineIndex != null && c.legendsLineIndex !== ''){
        obj.legendsLineIndex = clamp(parseInt(c.legendsLineIndex,10), 0, out.spacesCount-1);
      }
      return obj;
    }).sort((a,b)=>a.cornerLineIndex-b.cornerLineIndex) : [];
    // Merge duplicates by keeping the first.
    const seen=new Set();
    out.corners = out.corners.filter(c => {
      if (seen.has(c.cornerLineIndex)) return false;
      seen.add(c.cornerLineIndex); return true;
    });
    // Optional Map View layout + theme (purely cosmetic)
    if (Array.isArray(out.mapPoly)){
      out.mapPoly = out.mapPoly
        .filter(p => Array.isArray(p) && p.length>=2)
        .map(p => [clamp(+p[0],0,1), clamp(+p[1],0,1)]);
      if (out.mapPoly.length < 4) out.mapPoly = null;
    } else {
      out.mapPoly = null;
    }
    out.mapTheme = (out.mapTheme || out.mapTheme===0) ? String(out.mapTheme) : null;

    return out;
  }

      if (!raw) return [];
      const arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return [];
      // Normalize shape

        .filter(x => x && typeof x.id==='string' && x.track)
        .map(x => ({
          id: String(x.id),
          name: String(x.name || x.track?.name || x.id),
          track: normalizeTrack(x.track)
        }));
    }catch(e){

  function isUserPresetId(id){
    if (!id || id==='custom') return false;
    const list = loadCustomPresets();
    return list.some(p => p.id === id);

  function makeUserPresetId(){
    // Deterministic enough for local storage; still unique in practice

  function getAllPresets(){
    const builtIns = (TRACK_LIBRARY||[]).filter(p => p && p.id && p.id !== 'custom');
    const customs = loadCustomPresets();

  function getInitialTrack(){
    const pid = getInitialTrackPresetId();
    if (pid === 'custom') return loadCustomTrack();
    const preset = getPresetById(pid);

  function setTrack(nextTrack, {persist=true, remapPositions=true, presetId=null} = {}){
    // Guard: championship or setup may call setTrack(null) before a preset is chosen
    if (!nextTrack){
      try{
        nextTrack = (typeof structuredClone === 'function') ? structuredClone(DEFAULT_TRACK) : JSON.parse(JSON.stringify(DEFAULT_TRACK));
      }catch(e){
        nextTrack = DEFAULT_TRACK;
      }
    }
    const nt = normalizeTrack(nextTrack);
    G.track = nt;

    // Persist selected preset id + custom track json (if applicable)
    if (persist){
      try{
        const pid = presetId || G.trackPresetId || 'custom';
        localStorage.setItem(TRACK_SELECTED_KEY, pid);
        if (pid === 'custom'){
          localStorage.setItem(TRACK_CUSTOM_KEY, JSON.stringify(nt));
        }
      }catch(e){}
    }

    // Remember current selection in-state
    if (presetId) G.trackPresetId = presetId;
    if (!G.trackPresetId) G.trackPresetId = 'custom';

    // Apply any saved map path override for this track preset
    applyPolyOverrideToCurrentTrack();

    if (remapPositions && Array.isArray(G.players)){
      const N = nt.spacesCount;
      for (const p of G.players){
        if (!p || !p.pos) continue;
        p.pos.idx = ((p.pos.idx % N) + N) % N;
        p.pos.lane = (nt.spotsPerSpace===1) ? 0 : clamp(p.pos.lane,0,1);
      }
    }

    // Changing track invalidates module token placement & draft state.
    G.weatherRoad = null;
    G.draft = null;
    return nt;
  }

    if (!bg){
      delete trackBgByTrack[k];
      bgImgCache.delete(k);
      persistBgStore();
      updateBgUI();
      renderTrack();
      return;
    }
    trackBgByTrack[k] = bg;
    persistBgStore();
    updateBgUI();
    renderTrack();
  }
  function updateBgUI(){

  let history = [];

  function pushHistory(reason){
    if (!G) return;
    history.push({snap: deepClone(G), reason, t: Date.now()});
    if (history.length > 60) history.shift();
    updateUndoBtn();
  }

  function undo(){
    if (!history.length) return;
    const last = history.pop();
    G = last.snap;
    // Rebuild rng to current seed/stream index.
    rng = makeRng(G.seed, G.rngCalls);
    log(`Undo: ${last.reason}`);
    renderAll();
    updateUndoBtn();
  }

  function makeRng(seedStr, callCount=0){
    const seedFn = xmur3(seedStr);
    const r = mulberry32(seedFn());
    // burn calls
    for (let i=0;i<callCount;i++) r();
    const wrap = () => {
      G.rngCalls++;
      return r();
    };
    return wrap;
  }

  
/***********************
 * Legends Module (editable deck)
 * - Optional AI behavior: per AI player choose "Normal" or "Legend"
 * - Shared 10-card Legends deck: one card revealed per round (first Legend to act)
 ***********************/
const LEGEND_KEYS = ['red','blue','green','yellow','black','white'];

function defaultLegendsDeck(){
  // Placeholder defaults (editable in UI). Enter official values in the Legends Deck Editor.
  // Structure: 10 cards, each card has per-car {top, diamond}.
  const baseTops = [18,16,18,15,17,19,14,16,18,15];
  const baseDia  = [3,2,3,1,2,0,1,2,3,1];
  return Array.from({length:10}, (_,i)=>{
    const per = {};
    for (let k=0;k<LEGEND_KEYS.length;k++){
      const key = LEGEND_KEYS[k];
      // Mild variation per key so the defaults are usable out of the box.
      const top = Math.max(8, Math.min(20, baseTops[i] - (k%3)));
      const diamond = Math.max(0, Math.min(3, (baseDia[i] + k)%4));
      per[key] = {top, diamond};
    }
    return {id:i+1, per};
  });
}

function normalizeLegendsConfig(cfg){
  if (!cfg || typeof cfg !== 'object') return {enabled:false, pro:false, cards: defaultLegendsDeck()};
  if (!Array.isArray(cfg.cards) || cfg.cards.length !== 10) cfg.cards = defaultLegendsDeck();
  for (let i=0;i<10;i++){
    const c = cfg.cards[i] || {id:i+1, per:{}};
    c.id = (typeof c.id === 'number') ? c.id : (i+1);
    if (!c.per || typeof c.per !== 'object') c.per = {};
    for (const key of LEGEND_KEYS){
      if (!c.per[key] || typeof c.per[key] !== 'object') c.per[key] = {top:12, diamond:1};
      let top = Number(c.per[key].top); if (!Number.isFinite(top)) top = 12;
      let dia = Number(c.per[key].diamond); if (!Number.isFinite(dia)) dia = 1;
      c.per[key].top = Math.max(0, Math.min(30, Math.round(top)));
      c.per[key].diamond = Math.max(0, Math.min(3, Math.round(dia)));
    }
    cfg.cards[i] = c;
  }
  cfg.enabled = !!cfg.enabled;
  cfg.pro = !!cfg.pro;
  return cfg;
}

function ensureLegendsRuntime(){
  if (!G) return;
  G.legendsConfig = normalizeLegendsConfig(G.legendsConfig);
  // Keep modules mirror flags (for convenience)
  if (G.modules){
    G.modules.legends = !!G.modules.legends;
    G.modules.proLegends = !!G.modules.proLegends;
  }
  if (!G.legends || typeof G.legends !== 'object'){
    G.legends = {deck:[], discard:[], roundCard:null, roundNo:0};
  }
  if (!Array.isArray(G.legends.deck)) G.legends.deck = [];
  if (!Array.isArray(G.legends.discard)) G.legends.discard = [];
  if (G.legends.deck.length === 0 && G.legends.discard.length === 0){
    // initialize deck as indices [0..9]
    G.legends.deck = Array.from({length:10}, (_,i)=>i);
    shuffleInPlace(G.legends.deck, rng);
    G.legends.discard = [];
    G.legends.roundCard = null;
  }
}

function drawLegendsCard(){
  ensureLegendsRuntime();
  if (G.legends.deck.length === 0){
    G.legends.deck = G.legends.discard.slice();
    G.legends.discard = [];
    shuffleInPlace(G.legends.deck, rng);
  }
  const idx = G.legends.deck.shift();
  G.legends.discard.push(idx);
  const card = G.legendsConfig.cards[idx] || null;
  G.legends.roundCard = card;
  return card;
}

function legendKeyForPlayer(p){
  return p && p.carKey ? p.carKey : LEGEND_KEYS[0];
}

function distForward(fromIdx, toIdx, n){
  let d = (toIdx - fromIdx + n) % n;
  if (d === 0) d = n;
  return d;
}

function getNextCornerFrom(idx){
  const t = G.track;
  if (!t || !Array.isArray(t.corners) || t.corners.length === 0) return null;
  const n = t.spacesCount;
  let best = null;
  for (const c of t.corners){
    const d = distForward(idx, c.cornerLineIndex, n);
    if (!best || d < best.dist) best = {corner:c, dist:d};
  }
  return best;
}

function getSecondCornerAfter(firstCorner){
  const t = G.track;
  if (!t || !Array.isArray(t.corners) || t.corners.length < 2) return null;
  const n = t.spacesCount;
  const from = firstCorner.cornerLineIndex;
  let best = null;
  for (const c of t.corners){
    if (c === firstCorner) continue;
    const d = distForward(from, c.cornerLineIndex, n);
    if (!best || d < best.dist) best = {corner:c, dist:d};
  }
  return best;
}

function legendsLineIndexForCorner(corner){
  const t = G.track;
  const n = t.spacesCount;
  if (corner.legendsLineIndex != null){
    return ((Number(corner.legendsLineIndex)||0) % n + n) % n;
  }
  // default approximation: 4 spaces before corner line
  return (corner.cornerLineIndex - 4 + n) % n;
}

function isBetweenLegendsLineAndCorner(posIdx, corner){
  const t = G.track;
  const n = t.spacesCount;
  const legLine = legendsLineIndexForCorner(corner);
  const distFromLeg = (posIdx - legLine + n) % n;
  const distCornerFromLeg = (corner.cornerLineIndex - legLine + n) % n;
  // between means after the legends line but before the corner line (non-wrapping measure)
  return distFromLeg > 0 && distFromLeg < distCornerFromLeg;
}

function doLegendMove(p){
  ensureLegendsRuntime();
  const card = G.legends.roundCard || drawLegendsCard();
  const key = legendKeyForPlayer(p);
  const entry = (card && card.per && card.per[key]) ? card.per[key] : {top:12, diamond:1};
  const topBase = Number(entry.top)||0;
  const diamond = Math.max(0, Math.min(3, Number(entry.diamond)||0));
  const top = topBase + (G.modules && G.modules.proLegends ? 1 : 0);

  const t = G.track;
  const n = t.spacesCount;
  const from = p.pos.idx;
  const next = getNextCornerFrom(from);
  let move = 0;
  let mode = 'B';
  if (next){
    const corner = next.corner;
    const distToCorner = next.dist;
    const clearing = isBetweenLegendsLineAndCorner(from, corner);
    if (clearing){
      mode = 'A';
      move = (Number(corner.speedLimit)||0) + diamond;
      // cannot cross 2 corners
      const second = getSecondCornerAfter(corner);
      if (second){
        const distToSecondFromHere = distForward(from, second.corner.cornerLineIndex, n);
        if (move >= distToSecondFromHere) move = Math.max(0, distToSecondFromHere - 1);
      }
    } else {
      // approaching
      if (top < distToCorner){
        move = top;
      } else {
        move = Math.max(0, distToCorner - 1 - diamond);
      }
    }
  } else {
    move = top;
  }

  // Move without corner penalties / slipstream / boost.
  const res = moveExact(p, move, {countCorners:false});
  log(`[R${G.round}] ${p.name} (Legend AI) uses Legends card ${card?('#'+card.id):''} [${key}] mode ${mode}: top ${topBase} (pro ${G.modules&&G.modules.proLegends?'+1':'0'}), ◇${diamond} → moves ${move}.`);

  // Mark as resolved this round so resolution-order rebuilds don't loop.
  p._resolvedThisRound = true;

  return {nextStep: STEP.DONE, legend:true, moved:move, res};
}

  /***********************
   * Logging
   ***********************/
  function log(msg){
    if (!G) return;
    const line = `[R${G.round}] ${msg}`;
    G.log.push({t:Date.now(), line});
    const el = document.createElement('p');
    el.className = 'item';
    el.innerHTML = escapeHtml(line).replace(/\[(R\d+)\]/, '<strong>[$1]</strong>');
    const box = $('#log');
    box.appendChild(el);
    // Auto-scroll to bottom so the newest events appear last (chronological reading).
    box.scrollTop = box.scrollHeight;
  }

  function escapeHtml(s){
    return (s+"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function rebuildLog(){
    const box = $('#log');
    box.innerHTML = '';
    // Render chronologically: oldest at top, newest at bottom.
    (G.log||[]).forEach(e => {
      const p=document.createElement('p');
      p.className='item';
      p.innerHTML = escapeHtml(e.line).replace(/\[(R\d+)\]/, '<strong>[$1]</strong>');
      box.appendChild(p);

    box.scrollTop = box.scrollHeight;
