  function draftPick(cardId, auto){
    const d = G.draft;
    if (!d) return;
    const pid = d.currentPlayerId;
    const p = G.players.find(x=>x.id===pid);
    if (!p) return;

    const picks = d.picks[pid] || (d.picks[pid]=[]);
    if (picks.length >= 3){
      advanceDraftPicker();
      return;
    }

    let chosen = null;
    if (cardId){
      const i = d.market.findIndex(c=>c.id===cardId);
      if (i>=0) chosen = d.market.splice(i,1)[0];
    }
    if (!chosen){
      // AI / auto: pick the best by heuristic (prefer cooldown if heat clogs, prefer slip/limit mods, avoid upgrade-heat)
      chosen = chooseUpgradeFromMarket(p, d.market);
      const i = d.market.findIndex(c=>c.id===chosen.id);
      if (i>=0) d.market.splice(i,1);
    }

    if (!chosen){
      // Shouldn't happen; if market empty, rebuild it.
      log(`Draft warning: market empty. Re-dealing market.`);
      dealNewMarketAndContinue();
      return;
    }

    picks.push(chosen);
    log(`${p.name} drafts ${fmtUpgradeCardShort(chosen)}.`);

    d.pickedThisRound++;

    // Move to next picker within this round, or end round when everyone picked
    if (d.pickedThisRound >= G.players.filter(x=>!x.finished).length){
      // discard leftovers
      if (d.market.length){
        d.discards.push(...d.market.splice(0, d.market.length));
      }
      d.round++;
      if (d.round <= 3){
        dealNewMarketAndContinue();
      } else {
        finalizeDraftAndStart();
      }
      return;
    }

    advanceDraftPicker();
  }

  function dealNewMarketAndContinue(){
    const d = G.draft;
    if (!d) return;

    // Deal new market (players+3)
    const nPlayers = G.players.filter(p=>!p.finished).length;

    if (d.pool.length === 0 && d.discards.length){
      d.pool = d.discards.splice(0, d.discards.length);
      shuffleInPlace(d.pool, rng);
    }

    d.market = [];
    for (let i=0;i<nPlayers+3;i++){
      if (d.pool.length === 0){
        if (d.discards.length){
          d.pool = d.discards.splice(0, d.discards.length);
          shuffleInPlace(d.pool, rng);
        }
      }
      if (d.pool.length === 0) break;
      d.market.push(d.pool.pop());
    }

    // Set pick order for round
    const cars = sortedCars(true, false); // front to back
    d.order = (d.round === 2) ? cars.map(p=>p.id) : cars.slice().reverse().map(p=>p.id);
    d.pickerIdx = 0;
    d.pickedThisRound = 0;
    d.currentPlayerId = d.order[d.pickerIdx];

    log(`Draft Round ${d.round}/3 begins. Picker order: ${d.order.map(pidToName).join(' → ')}`);
    renderAll();
    hookDraftUI();
  }

  function advanceDraftPicker(){
    const d = G.draft;
    if (!d) return false;

    const order = d.order || [];
    const n = order.length;
    if (!n){
      // No order? force finalize safeguards
      finalizeDraftAndStart();
      return false;
    }

    // Find next player in order who still needs picks (<3).
    for (let step=0; step<n; step++){
      d.pickerIdx = (d.pickerIdx + 1) % n;
      const pid = order[d.pickerIdx];
      const picks = d.picks[pid] || [];
      if (picks.length < 3){
        d.currentPlayerId = pid;
        renderAll();
        hookDraftUI();
        return true;
      }
    }

    // Everyone already has 3 picks — finalize the draft.
    finalizeDraftAndStart();
    return false;
  }

  function chooseUpgradeFromMarket(p, market){
    if (!market || !market.length) return null;

    const upcomingCorners = (G.track.corners||[]).slice().sort((a,b)=>a.cornerLineIndex-b.cornerLineIndex);
    const heatInHand = p.hand && p.hand.some(c=>c.type==='heat');
    function score(c){
      if (c.type==='heat' && c.origin==='upgrade') return -50;
      if (c.type!=='upgrade') return 0;
      let s = 0;
      s += (c.value||0);
      s += (c.plus||0)*1.2;
      s += (c.cool||0) * (heatInHand?2.0:1.0);
      s += (c.reduceStress||0) * 0.6;
      s += (c.slipBonus||0) * 0.7;
      s += Math.abs(c.limitMod||0) * 0.8;
      // penalize mandatory heat costs if engine low at start
      s -= (c.payHeatCost||0) * (p.engine && p.engine.length<3 ? 1.2 : 0.6);
      // penalize heavy scrap early
      s -= (c.scrap||0) * 0.2;
      return s + (rng()*0.001);
    }
    return market.slice().sort((a,b)=>score(b)-score(a))[0];
  }

  function finalizeDraftAndStart(){
    const d = G.draft;
    if (!d) return;

    // Ensure everyone has 3 picks (fail-safe)
    const live = G.players.filter(p=>!p.finished);
    for (const p of live){
      while ((d.picks[p.id]||[]).length < 3){
        // pull from market then pool
        let c = d.market.pop();
        if (!c) c = d.pool.pop();
        if (!c){
          if (d.discards.length){
            d.pool = d.discards.splice(0, d.discards.length);
            shuffleInPlace(d.pool, rng);
            c = d.pool.pop();
          }
        }
        if (!c) break;
        (d.picks[p.id]||[]).push(c);
      }
    }

    for (const p of live){
      const picks = d.picks[p.id] || [];
      p.deck.push(...picks);
      shuffleInPlace(p.deck, rng);
    }
    // leftovers are discarded (ignored)
    G.draft = null;
    log('Garage Draft complete. Each player has 3 Upgrade cards shuffled into their deck.');
    finalizeStartRaceIntoPlanning();
  }

  function champTrackSchedule(preset, races){
    const keys = Object.keys(TRACK_LIBRARY||{}).filter(k=>k!=='custom');
    if (!keys.length) return Array.from({length:races},()=>getInitialTrackPresetId());
    if (preset === 'us'){
      const usId = keys.find(k=>k.toLowerCase().includes('us')) || keys[0];
      return Array.from({length:races},()=>usId);
    }
    // mixed
    const out = [];
    for (let i=0;i<races;i++){
      out.push(keys[Math.floor(rng()*keys.length)]);
    }
    return out;
  }

  // Ensure discard-pick state is a Set (older saves / clones may turn Sets into arrays/objects)
  function ensureDiscardPickSet(){
    const dp = G._discardPick;
    if (dp instanceof Set) return dp;
    if (Array.isArray(dp)) { G._discardPick = new Set(dp); return G._discardPick; }
    if (dp && typeof dp === 'object') {
      // accept {id:true} maps
      const ids = Object.keys(dp).filter(k => dp[k]);
      G._discardPick = new Set(ids);
      return G._discardPick;
    }
    G._discardPick = new Set();
    return G._discardPick;
  }

function startChampionshipFromSetup({heat, stress}){
    pushHistory('Start Championship');
    ensureChamp();
    G.champ.enabled = true;
    G.champ.heat = heat;
    G.champ.stress = stress;
    G.champ.raceIndex = 0;
    G.champ.racesTotal = clamp((G.champConfig?.races)||4, 1, 12);
    G.champ.points = (G.champConfig?.points?.length ? G.champConfig.points.slice() : CHAMP_DEFAULT_POINTS.slice());
    G.champ.schedule = champTrackSchedule(G.champConfig?.schedulePreset||'mix', G.champ.racesTotal);

    // Fresh decks for season
    G.champ.sponsorDeck = buildSponsorshipDeck();
    G.champ.sponsorUsed = [];
    G.champ.upgradeDeck = buildUpgradeDeck(G.modules.upgradePool);
    G.champ.upgradeUsed = [];

    // Initialize player championship meta
    for (const p of G.players){
      champResetPlayerZones(p);
      p.champ = {points:0, upgrades:[], sponsors:[], lastFinish: 999};
    }

    // First race: random grid
    setTrack(getTrackPreset(G.champ.schedule[0]).track, {persist:false, presetId:G.champ.schedule[0], remapPositions:false});
    randomizeStartingGrid();

    // Race state reset
    G.phase = PHASE.DRAFT;
    G.round = 1;
    G.startedCount = 0;
    G.finishedOrder = [];
    G.resolveOrder = [];
    G.resolveIdx = 0;
    G.activeStep = STEP.REVEAL_MOVE;
    G.log = [];
    rebuildLog();
    log(`Championship begins: ${G.champ.racesTotal} race(s). Race 1 on "${getTrackPreset(G.champ.schedule[0]).name}".`);

    champSetupPressCorners();
    initChampBuildDraft();
    renderAll();
  }

  function champSetupPressCorners(){
    if (!G.champ) return;
    const corners = (G.track.corners||[]).slice().sort((a,b)=>a.cornerLineIndex-b.cornerLineIndex);
    if (!corners.length){ G.champ.pressCorners = []; return; }
    const mode = (G.champConfig?.pressCornersMode)||'first';
    if (mode === 'random'){
      const c = corners[Math.floor(rng()*corners.length)];
      G.champ.pressCorners = [c.cornerLineIndex];
    } else {
      G.champ.pressCorners = [corners[0].cornerLineIndex];
    }
  }

  function getTrackPreset(id){
    const entry = TRACK_LIBRARY[id] || TRACK_LIBRARY[getInitialTrackPresetId()];
    return entry || {name:'Track', track:getInitialTrack()};
  }

  function champGridOrderFrontToBack(){
    // standings desc points, tie by lastFinish asc
    const arr = G.players.slice().filter(p=>!p.removedFromTrack);
    arr.sort((a,b)=>{
      const ap=a.champ?.points||0, bp=b.champ?.points||0;
      if (bp!==ap) return bp-ap;
      const al=a.champ?.lastFinish||999, bl=b.champ?.lastFinish||999;
      if (al!==bl) return al-bl;
      return a.name.localeCompare(b.name);
    });
    return arr.map(p=>p.id);
  }

  function champPlaceGridFromFrontToBack(orderFront){
    // place back-to-front so frontmost ends up in the most forward slot
    const backToFront = orderFront.slice().reverse();
    const t = G.track;
    let idx = t.startGridStartIndex ?? 0;
    let lane = 0;
    for (const pid of backToFront){
      const p = G.players.find(x=>x.id===pid);
      if (!p) continue;
      const placed = placeWithBlocking(p, idx);
      p.pos.idx = placed.idx;
      p.pos.lane = placed.lane;
      // alternate lanes then advance
      if (t.spotsPerSpace === 1){ lane = 0; idx = stepForward(idx); }
      else {
        if (lane===0){ lane = 1; p.pos.lane = 0; } // keep RL preference in blocking logic
        else { lane = 0; idx = stepForward(idx); }
      }
      if (t.spotsPerSpace===2){
        // enforce desired lane: first car on a space goes RL, second goes OUT
        const occ = occupiedAt(idx);
      }
    }
  }

  function champBuildRaceDecksAndStart(){
    // rebuild every player's race deck from base + owned upgrades + owned sponsors
    const heat = G.champ.heat;
    const stress = G.champ.stress;

    for (const p of G.players){
      champResetPlayerZones(p);
      const base = makeBasicDeck(p.color);
      const stressCards = makeStressCards(stress, p.color);
      const upgs = (p.champ?.upgrades||[]).map(c=>deepClone(c));
      const spons = (p.champ?.sponsors||[]).map(c=>deepClone(c));
      // reset variable choices each race
      for (const c of [...upgs, ...spons]){
        if (c && c.choices) c.chosen = null;
      }
      p.deck = base.concat(stressCards, upgs, spons);
      shuffleInPlace(p.deck, rng);
      p.engine = makeHeatCards(heat, p.color);
      p.hand = [];
      p.discard = [];
      p.play = [];
      p.gear = 1;
      p.lap = 0;
      p.finished = false;
      p.removedFromTrack = false;
      p.finishRank = null;
    p.finishedOnRound = null;
      p.finishedOnRound = null;
      // draw 7
      for (let i=0;i<7;i++){
        const c = drawFromDeck(p, {allowReshuffle:true});
        if (c) p.hand.push(c);
      }
      // start sponsorship for this race (event)
      const nS = clamp(G.champConfig?.startSponsorship||1, 0, 5);
      for (let i=0;i<nS;i++){
        const sp = champDrawSponsorCard();
        if (sp){
          p.champ.sponsors.push(deepClone(sp));
          p.hand.push(sp);
        }
      }
    }

    // Set starting grid based on standings from race 2 onward
    if (G.champ.raceIndex > 0){
      const frontOrder = champGridOrderFrontToBack();
      champPlaceGridFromFrontToBack(frontOrder);
      log('Starting grid set by Championship standings.');
    }

    initWeatherRoadIfEnabled();
    finalizeStartRaceIntoPlanning();
  }

  function champDrawSponsorCard(){
    ensureChamp();
    if (!G.champ.sponsorDeck.length){
      if (G.champ.sponsorUsed.length){
        G.champ.sponsorDeck = G.champ.sponsorUsed.splice(0, G.champ.sponsorUsed.length);
        shuffleInPlace(G.champ.sponsorDeck, rng);
      }
    }
    const c = G.champ.sponsorDeck.pop();
    return c ? deepClone(c) : null;
  }

  function champAwardSponsorToPlayer(p, reason, cornerIdx=null){
    if (!G.modules.championship || !G.champ) return;
    const card = champDrawSponsorCard();
    if (!card){ log(`${p.name} would gain a Sponsorship, but the deck is empty.`); return; }
    p.champ.sponsors.push(deepClone(card));
    p.discard.push(card);
    p.publicTopDiscard = card;
    if (cornerIdx!=null){
      log(`${p.name} earns a Sponsorship at Press Corner @${cornerIdx} (${reason}).`);
    } else {
      log(`${p.name} earns a Sponsorship (${reason}).`);
    }
  }

  function isPressCorner(idx){
    return !!(G.champ && (G.champ.pressCorners||[]).includes(idx));
  }

  function initChampBuildDraft(){
    ensureChamp();
    const live = G.players.filter(p=>!p.finished);
    const order = live.slice().sort((a,b)=>{
      // worst-to-best picks first (points asc; lastFinish desc)
      const ap=a.champ?.points||0, bp=b.champ?.points||0;
      if (ap!==bp) return ap-bp;
      const al=a.champ?.lastFinish||999, bl=b.champ?.lastFinish||999;
      if (al!==bl) return bl-al;
      return a.name.localeCompare(b.name);
    }).map(p=>p.id);

    // Deal market
    const need = order.length + 3;
    const market = [];
    while (market.length < need){
      if (!G.champ.upgradeDeck.length){
        if (G.champ.upgradeUsed.length){
          G.champ.upgradeDeck = G.champ.upgradeUsed.splice(0, G.champ.upgradeUsed.length);
          shuffleInPlace(G.champ.upgradeDeck, rng);
        } else break;
      }
      const c = G.champ.upgradeDeck.pop();
      if (!c) break;
      market.push(deepClone(c));
    }

    G.draft = {
      kind:'champBuild',
      order,
      pickerIdx: 0,
      currentPlayerId: order[0],
      market,
      picks: {},
      selectedId: null,
      stage:'pick',
      swapUsed:false
    };

    log('Build Your Car: each player drafts 1 Upgrade (worst→best). Last picker may optionally swap after picking.');
  }

}

  function champDraftPickSelected(){
    const d = G.draft;
    if (!d) return;
    const pid = d.currentPlayerId;
    const p = G.players.find(x=>x.id===pid);
    if (!p || p.isAI) return;
    const selId = d.selectedId;
    const card = d.market.find(c=>c.id===selId);
    if (!card){ toast('Select a card.'); return; }
    (d.picks[pid]  = d.picks[pid]  || []).push(card);
    d.market = d.market.filter(c=>c.id!==selId);
    log(`${p.name} drafts ${card.name||'Upgrade'}.`);
    d.selectedId = null;
    champDraftAdvance();
  }

  function champDraftAIPick(){
    const d = G.draft;
    if (!d) return;
    const pid = d.currentPlayerId;
    const p = G.players.find(x=>x.id===pid);
    if (!p || !p.isAI) return;
    const choice = chooseUpgradeFromMarket(p, d.market);
    if (!choice){ toast('No market cards.'); return; }
    (d.picks[pid]  = d.picks[pid]  || []).push(choice);
    d.market = d.market.filter(c=>c.id!==choice.id);
    log(`${p.name} drafts ${choice.name||'Upgrade'}.`);
    champDraftAdvance();
  }

  function champDraftAdvance(){
    const d = G.draft;
    if (!d) return;
    // next picker
    if (d.pickerIdx >= d.order.length-1){
      // all picked
      champDraftFinalize();
      return;
    }
    d.pickerIdx++;
    d.currentPlayerId = d.order[d.pickerIdx];
    renderAll();
    hookChampDraftUI();
  }

  function champDraftFinalize(){
    const d = G.draft;
    if (!d) return;

    // Last picker optional swap (human only for now; AI may choose to swap if better).
    const lastId = d.order[d.order.length-1];
    const lastP = G.players.find(x=>x.id===lastId);
    const picked = (d.picks[lastId]||[])[0];

    if (lastP && lastP.isAI && picked && d.market.length){
      // simple: swap if best market score > picked score
      const best = chooseUpgradeFromMarket(lastP, d.market);
      const cand = best;
      if (cand){
        // compare scores by heuristic: reuse chooser ordering
        const pool = [picked, cand].filter(Boolean);
        const top = chooseUpgradeFromMarket(lastP, pool);
        if (top && top.id !== picked.id){
          // swap
          d.market = d.market.filter(c=>c.id!==cand.id);
          d.market.push(picked);
          d.picks[lastId] = [cand];
          log(`${lastP.name} (AI) swaps to ${cand.name||'Upgrade'}.`);
        }
      }
    }

    // Apply picks to persistent upgrades
    for (const pid of d.order){
      const p = G.players.find(x=>x.id===pid);
      const c = (d.picks[pid]||[])[0];
      if (p && c){
        p.champ.upgrades.push(deepClone(c));
      }
    }

    // Return remaining market to upgrade deck
    if (d.market.length){
      for (const c of d.market) G.champ.upgradeUsed.push(deepClone(c));
    }
    G.draft = null;

    log('Build Your Car complete. Starting race setup...');
    champBuildRaceDecksAndStart();
  }

  function champAwardPointsForRace(){
    const pts = (G.champ?.points && G.champ.points.length) ? G.champ.points : CHAMP_DEFAULT_POINTS;
    const order = G.finishedOrder.slice();
    for (let i=0;i<order.length;i++){
      const pid = order[i];
      const p = G.players.find(x=>x.id===pid);
      if (!p) continue;
      const add = (i < pts.length) ? pts[i] : 0;
      p.champ.points += add;
      p.champ.lastFinish = i+1;
    }
  }

  function champStandings(){
    const arr = G.players.slice();
    arr.sort((a,b)=>{
      const ap=a.champ?.points||0, bp=b.champ?.points||0;
      if (bp!==ap) return bp-ap;
      const al=a.champ?.lastFinish||999, bl=b.champ?.lastFinish||999;
      return al-bl;
    });
    return arr;
  }

  function champNextRace(){
    if (!G.champ) return;
    champAwardPointsForRace();
    G.champ.raceIndex++;
    if (G.champ.raceIndex >= G.champ.racesTotal){
      log('Championship complete.');
      G.phase = PHASE.FINISHED;
      renderAll();
      return;
    }

    // Reset race state
    G.round = 1;
    G.resolveOrder = [];
    G.resolveIdx = 0;
    G.planningIdx = 0;
    G.finishedOrder = [];
    for (const p of G.players){
      p.finished = false;
      p.removedFromTrack = false;
      p.finishRank = null;
    p.finishedOnRound = null;
      p.finishedOnRound = null;
      p.lap = 0;
      p.gear = 1;
      p._resolvedThisRound = false;
      p._revealPrepared = false;
      p._revealProcessed = false;
      p._movedThisReveal = false;
    }

    // Load next track + press corners
    const presetId = G.champ.schedule[G.champ.raceIndex];
    const preset = getTrackPreset(presetId);
    setTrack(preset.track, {persist:false, presetId, remapPositions:false});

    // Starting grid based on standings (will be placed during deck build)
    log(`Race ${G.champ.raceIndex+1} begins on "${preset.name}".`);

    // Run Build Your Car draft again
    G.phase = PHASE.DRAFT;
    initChampBuildDraft();
    renderAll();
  }

function applyTrackBasics(){
    const spaces = parseInt($('#trkSpaces').value,10);
    const spots = parseInt($('#trkSpots').value,10);
    const finish = parseInt($('#trkFinish').value,10);
    const laps = parseInt($('#trkLaps').value,10);
    const start = parseInt($('#trkStart').value,10);
    const t = normalizeTrack({...G.track, spacesCount:spaces, spotsPerSpace:spots, finishIndex:finish, lapsRequired:laps, startGridStartIndex:start});
    // Re-clip corners into new range
    t.corners = (G.track.corners||[]).filter(c => c.cornerLineIndex < t.spacesCount);
    setTrack(t, {persist:true, presetId:(isUserPresetId(G.trackPresetId)?G.trackPresetId:'custom'), remapPositions:true});
  }

  function setSeedFromInput(){
    const s = ($('#seedInput').value||'').trim();
    if (!s){ toast('Seed cannot be empty.'); return; }
    G.seed = s;
    G.rngCalls = 0;
    rng = makeRng(G.seed, 0);
    log(`Seed set to ${G.seed}.`);
  }

  function addPlayer(isAI){
    if (G.players.length >= 6){ toast('Max 6 players.'); return; }
    pushHistory('Add player');
    const palette = ['#ff5b74','#5bd6ff','#7dff9b','#ffce5b','#b58cff','#ff8c5b'];
    const used = new Set(G.players.map(p=>p.color));
    const color = palette.find(c=>!used.has(c)) || '#5bd6ff';
    const name = isAI ? `AI ${G.players.length+1}` : `P${G.players.length+1}`;
    // temporary shell player (final decks built on start)
    G.players.push({
      id: uid('tmp'), name, color, isAI,
      aiProfile: 'normal',
      carKey: (function(){ const keys = (typeof LEGEND_KEYS!=='undefined'?LEGEND_KEYS:['red','blue','green','yellow','black','white']); const used=new Set(G.players.map(pp=>pp.carKey)); return (keys.find(k=>!used.has(k))||keys[G.players.length]||'red'); })(),
      gear: 1, engine: [], deck: [], discard: [], hand: [], play: [],
      boostUsed:false, pos:{idx:0,lane:0}, lap:0, finished:false, removedFromTrack:false, finishRank:null, finishedOnRound:null,
      planned:{gearTarget:1, payHeatForShift:false, cards:[], locked:false},
      publicTopDiscard:null
    });
    renderAll();
  }

  function randomizeStartingGrid(){
    const active = G.players;
    // Shuffle order
    const ids = active.map(p=>p.id);
    for (let i=ids.length-1;i>0;i--){
      const j = Math.floor(rng()*(i+1));
      [ids[i], ids[j]] = [ids[j], ids[i]];
    }
    const ordered = ids.map(id => active.find(p=>p.id===id));

    // Place one at a time filling spots in ascending order
    const t = G.track;
    const start = t.startGridStartIndex || 0;
    let cursor = start;
    let lane = 0;
    for (const p of ordered){
      p.pos.idx = cursor;
      p.pos.lane = lane;
      // advance lane then space
      if (t.spotsPerSpace === 2){
        lane = 1 - lane;
        if (lane === 0) cursor = (cursor + 1) % t.spacesCount;
      } else {
        cursor = (cursor + 1) % t.spacesCount;
      }
    }
    log('Starting grid randomized.');
  }

  function startRace(){
    if (G.players.length < 1){ toast('Add at least 1 player.'); return; }
    pushHistory('Start race');

    // Capture module toggles (in case user didn't trigger change event)
    const cbG = $('#modGarage'); if (cbG) G.modules.garage = !!cbG.checked;
    const cbW = $('#modWeather'); if (cbW) G.modules.weatherRoad = !!cbW.checked;
    const selU = $('#upgLevel'); if (selU) G.modules.upgradePool = selU.value;
    const cbL = $('#modLegends'); if (cbL) G.modules.legends = !!cbL.checked;
    const cbPL = $('#modProLegends'); if (cbPL) G.modules.proLegends = !!cbPL.checked && G.modules.legends;

    const cbC = $('#modChamp'); if (cbC) G.modules.championship = !!cbC.checked;
    // Championship overrides
    if (G.modules.championship){
      // Force advanced modules state
      G.modules.garage = false;
      G.modules.weatherRoad = true;
      // Capture config from inputs (best-effort)
      const heat = clamp(parseInt($('#cfgHeat').value||6,10), 0, 12);
      const stress = clamp(parseInt($('#cfgStress').value||3,10), 0, 8);
      startChampionshipFromSetup({heat, stress});
      return;
    }

    // Build player objects WITHOUT initial draw (so weather/draft can modify the deck first)
    const heat = clamp(parseInt($('#cfgHeat').value||6,10), 0, 12);
    const stress = clamp(parseInt($('#cfgStress').value||3,10), 0, 8);
    const built=[];
    for (const p0 of G.players){
      const p = makePlayer({
        name:p0.name,
        color:p0.color,
        isAI:p0.isAI,
        aiProfile:p0.aiProfile || 'normal',
        carKey:p0.carKey || null,
        heatInEngine:heat,
        stressInDeck:stress,
        useStartingUpgrades: !G.modules.garage,
        drawStartHand:false
      });
      built.push(p);
    }
    G.players = built;
    G.startedCount = built.length;

    // Place grid (random order by default)
    randomizeStartingGrid();

    // Prepare weather/road before draft so players could (in real game) draft accordingly.
    initWeatherRoadIfEnabled();
    applyWeatherSetupToAllPlayers();

    // If Garage Draft enabled, run draft first.
    if (G.modules.garage){
      initGarageDraft();
      renderAll();
      return;
    }

    // Otherwise, proceed to planning.
    finalizeStartRaceIntoPlanning();
  }

  function drawStartingHands(){
    for (const p of G.players){
      p.hand = [];
      p.play = [];
      // Draw 7
      for (let i=0;i<7;i++){
        const c = drawFromDeck(p, {allowReshuffle:true});
        if (!c) break;
        p.hand.push(c);
      }
      p.publicTopDiscard = topOf(p.discard);
      p.boostUsed = false;
      p.planned = {gearTarget: p.gear || 1, payHeatForShift:false, cards: []};
    }
  }

  function finalizeStartRaceIntoPlanning(){
    // Starting hands after all setup modifications.
    drawStartingHands();

    G.phase = PHASE.PLANNING;
    G.planningIdx = 0;
    G.round = 1;
    G.finishedOrder = [];
    // clear per-round markers
    for (const p of G.players){ delete p._resolvedThisRound; }

    log(`Race started with ${G.players.length} car(s), ${G.track.lapsRequired} lap(s).`);
    renderAll();
    ensurePlanning();
  }

  // renderPlanningUI replaced by global redesign layer
  function renderPlanningUI_ORIG_UNUSED(p){ return ""; }
  function hookPlanningUI(p){

    // Gear selection
    $('#gearSel').addEventListener('change', (e) => {
      const g = parseInt(e.target.value,10);
      pushHistory(`Shift gear (planning): ${p.name}`);
      const res = applyShift(p, g);
      if (!res.ok){ toast(res.reason); }
      else if (res.paid){ log(`${p.name} shifts 2 gears and pays 1 Heat.`); }
      renderAll();
    });

    // Card select

    hand.addEventListener('click', (e) => {

      if (!cardEl) return;
      const cid = cardEl.getAttribute('data-cid');
      const c = p.hand.find(x => x.id === cid);
      if (!c) return;
      if (!cardCanBePlayed(c)) return;

      const sel = new Set(p.planned.cards);
      if (sel.has(cid)) sel.delete(cid);
      else {
        if (sel.size >= p.gear) return;
        sel.add(cid);
      }
      p.planned.cards = Array.from(sel);
      const selCountEl = $('#selCount');
      if (selCountEl) selCountEl.textContent = String(sel.size);
      renderAll();
    });

    // Lock
    $('#btnLock').addEventListener('click', () => nextStep());
  }

  function renderResolutionUI_ORIG_UNUSED(p){ return ""; }
  function hookResolutionUI(p){
    if (!p) return;

    const nextBtn = $('#btnNext');
    if (nextBtn) nextBtn.addEventListener('click', () => nextStep());

    // Brakes choice during Reveal & Move
    if (G.activeStep === STEP.REVEAL_MOVE){
      const pc = G.pendingChoice;
      if (pc && pc.kind==='brake' && pc.pid===p.id){
        $$('[data-act="brakeChoice"]').forEach(btn=>{
          btn.addEventListener('click', ()=>{
            const val = parseInt(btn.getAttribute('data-val'), 10);
            const card = p.play.find(c=>c && c.id===pc.cardId);
            if (card){
              pushHistory(`Choose Brakes speed: ${p.name} → ${val}`);
              card.chosen = val;
            }
            G.pendingChoice = null;
            renderAll();
            nextStep();
          });
        });
      }
    }

    // Adrenaline toggles
    if (G.activeStep === STEP.ADRENALINE && G.adrenaline.eligible && !p.isAI){
      const m = $('#adrenMove');
      const c = $('#adrenCool');
      if (m) m.addEventListener('change', () => { G.adrenaline.move = !!m.checked; });
      if (c) c.addEventListener('change', () => { G.adrenaline.cooldownBonus = c.checked ? 1 : 0; });
    }// React buttons
if (G.activeStep === STEP.REACT){
  // Ensure queue exists for humans too
  if (!p._reactActions) buildReactActions(p);

  const cd = $('#btnCooldown');
  const bs = $('#btnBoost');
  const applyBtn = $('#btnActApply');
  const skipBtn = $('#btnActSkip');

  if (cd) cd.addEventListener('click', () => {
    pushHistory(`Gear Cooldown: ${p.name}`);
    doCooldown(p, cooldownCapacity(p));
    renderAll();
  });

  if (bs) bs.addEventListener('click', () => {
    pushHistory(`Boost: ${p.name}`);
    const res = doBoost(p);
    if (!res.ok) toast(res.reason);
    renderAll();
  });

  if (applyBtn) applyBtn.addEventListener('click', () => {
    const a = currentReactAction(p);
    if (!a) return;
    pushHistory(`Upgrade effect: ${p.name} ${a.cardLabel} (${a.type})`);
    const card = p.play.find(x=>x && x.id===a.cardId);

    if (a.type==='scrap'){
      resolveScrap(p, a.val);
      p._symbolsAppliedCount = (p._symbolsAppliedCount||0) + 1;
    } else if (a.type==='upgCooldown'){
      const max = Math.min(a.val, p.hand.filter(c=>c.type==='heat').length);
      const inp = $('#actNum');
      let n = inp ? parseInt(inp.value||'0',10) : max;
      n = clamp(isNaN(n)?max:n, 0, max);
      const moved = doCooldown(p, n, a.val);
      if (moved>0) p._symbolsAppliedCount = (p._symbolsAppliedCount||0) + 1;
    } else if (a.type==='reduceStress'){
      const max = Math.min(a.val, p.hand.filter(c=>c.type==='stress').length);
      const inp = $('#actNum');
      let n = inp ? parseInt(inp.value||'0',10) : max;
      n = clamp(isNaN(n)?max:n, 0, max);
      const moved = resolveReduceStress(p, n);
      if (moved>0) p._symbolsAppliedCount = (p._symbolsAppliedCount||0) + 1;
    } else if (a.type==='salvage'){
      const picks = $$('.actPick').filter(x=>x.checked).map(x=>x.value);
      if (picks.length > a.val){
        toast(`Pick at most ${a.val} card(s).`);
        return;
      }
      const moved = resolveSalvage(p, picks);
      if (moved>0) p._symbolsAppliedCount = (p._symbolsAppliedCount||0) + 1;
    } else if (a.type==='limitMod'){
      if ((G.cornerCrossed||[]).length){
        p._turnLimitMod = (p._turnLimitMod||0) + a.val;
        p._symbolsAppliedCount = (p._symbolsAppliedCount||0) + 1;
        log(`${p.name} applies ${a.cardLabel}: corner limit ${a.val>0?'+':'−'}${Math.abs(a.val)} this turn.`);
      } else {
        log(`${p.name} applies ${a.cardLabel}, but no corners were crossed this turn.`);
      }
    } else if (a.type==='slipBonus'){
      p._turnSlipBonus = (p._turnSlipBonus||0) + a.val;
      p._symbolsAppliedCount = (p._symbolsAppliedCount||0) + 1;
      log(`${p.name} applies ${a.cardLabel}: Slipstream +${a.val} this turn.`);
    } else if (a.type==='refresh'){
      if (card){ card._refreshChosen = true; }
      p._symbolsAppliedCount = (p._symbolsAppliedCount||0) + 1;
      log(`${p.name} sets ${a.cardLabel} to refresh (topdeck) at Replenish.`);
    } else if (a.type==='accelerate'){
      applyAccelerate(p);
      p._symbolsAppliedCount = (p._symbolsAppliedCount||0) + 1;
    }

    advanceReactAction(p);
    renderAll();
  });

  // Salvage UX: prevent selecting more than allowed by disabling extra checkboxes.
  const aNow = currentReactAction(p);
  if (aNow && aNow.type==='salvage'){
    const maxPick = aNow.val|0;
    const refreshPickLimits = () => {
      const picks = $$('.actPick');
      const selected = picks.filter(x=>x.checked).length;
      const lock = selected >= maxPick;
      picks.forEach(cb => {
        if (!cb.checked) cb.disabled = lock;
      });
    };
    $$('.actPick').forEach(cb => cb.addEventListener('change', refreshPickLimits));
    refreshPickLimits();
  }

  if (skipBtn) skipBtn.addEventListener('click', () => {
    const a = currentReactAction(p);
    if (!a) return;
    pushHistory(`Skip upgrade effect: ${p.name} ${a.cardLabel} (${a.type})`);
    log(`${p.name} skips ${a.cardLabel} (${a.type}).`);
    advanceReactAction(p);
    renderAll();
  });

  // React pending ends only when user clicks Finish React (and queue is done)
  G._reactPending = false;
}

    // Slipstream buttons
    if (G.activeStep === STEP.SLIPSTREAM){
      const slip = $('#btnSlip');
      const noslip = $('#btnNoSlip');
      if (slip) slip.addEventListener('click', () => {
        pushHistory(`Slipstream: ${p.name}`);
        doSlipstream(p, true);
        G._slipPending = false;
        G.activeStep = STEP.CHECK_CORNER;
        renderAll();
      });
      if (noslip) noslip.addEventListener('click', () => {
        pushHistory(`Skip slipstream: ${p.name}`);
        doSlipstream(p, false);
        G._slipPending = false;
        G.activeStep = STEP.CHECK_CORNER;
        renderAll();
      });
      // if not eligible, auto clear
      if (!slipEligible(p)) G._slipPending = false;
    }

    // Discard interactions
    if (G.activeStep === STEP.DISCARD){
      ensureDiscardPickSet();
      const hand = $('#hand');
      hand.addEventListener('click', (e) => {
        const cardEl = e.target.closest('.card');
        if (!cardEl) return;
        const cid = cardEl.getAttribute('data-cid');
        const c = p.hand.find(x => x.id === cid);
        if (!c || isNonDiscardable(c)) return;
        const dp = ensureDiscardPickSet();
        if (dp.has(cid)) dp.delete(cid);
        else dp.add(cid);
        renderAll();
      });

      $('#btnConfirmDiscard').addEventListener('click', () => {
        pushHistory(`Discard chosen: ${p.name}`);
        confirmDiscard(p, Array.from(ensureDiscardPickSet()));
        G._discardPick = new Set();
        renderAll();
      });
      $('#btnSkipDiscard').addEventListener('click', () => {
        pushHistory(`Skip discard: ${p.name}`);
        confirmDiscard(p, []);
        G._discardPick = new Set();
        renderAll();
      });

      G._discardPending = true;
    }

    // Let AI auto-advance when appropriate
    if (G.phase === PHASE.RESOLUTION){
      setTimeout(autoResolveAIIfNeeded, 0);
    }
  }

  function maybeAutoScroll(){

    if (G.phase === PHASE.PLANNING) p = G.players[G.planningIdx];

  function centerOnSpace(idx){
    const view = $('#trackView');
    const space = $(`#trackGrid .space:nth-child(${idx+1})`);
    if (!space) return;
    const rect = space.getBoundingClientRect();
    const vrect = view.getBoundingClientRect();
    const left = space.offsetLeft - (vrect.width/2) + (rect.width/2);
    view.scrollTo({left, behavior:'smooth'});
  }

  function loadGameFromFile(file){
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const obj = JSON.parse(reader.result);
        if (obj.type !== 'heat-core-sim-save') throw new Error('Not a Heat core sim save file.');
        pushHistory('Load game');
        G = obj.game;
        // Normalize + persist track just in case
        setTrack(G.track, {persist:true, presetId:(G.trackPresetId||'custom'), remapPositions:false});

        renderAll();
        log('Game loaded.');
      } catch(e){
        toast('Load failed: ' + e.message);
      }
    };
    reader.readAsText(file);

      newGame();
    });
    $('#btnTrackEditor').addEventListener('click', openTrackEditor);
    $('#btnHelp').addEventListener('click', openHelp);
    $('#modalClose').addEventListener('click', closeModal);
    $('#modalBack').addEventListener('click', (e) => { if (e.target === $('#modalBack')) closeModal(); });
    $('#btnClearLog').addEventListener('click', () => { pushHistory('Clear log'); G.log=[]; rebuildLog(); });
    $('#zoom').addEventListener('input', () => renderTrack());

    
    // Map path editor controls
    const btnPathEdit = $('#btnPathEdit');
    const btnPathReset = $('#btnPathReset');
    const pathStatus = $('#pathStatus');
    const canvas = $('#trackCanvas');

    function setPathEdit(on){
      mapEditEnabled = !!on;
      mapDragIndex = -1; mapDragging = false;
      if (btnPathEdit) btnPathEdit.classList.toggle('primary', mapEditEnabled);
      if (pathStatus){
        pathStatus.textContent = mapEditEnabled ? 'Editing (drag / Shift+Click add / Alt+Click delete)' : '';
      }
      renderTrack();
    }

    function enforceClosedPoly(poly){
      if (!Array.isArray(poly) || poly.length<4) return poly;
      // Ensure last equals first (closed loop)
      const a = poly[0], b = poly[poly.length-1];
      if (!b || a[0]!==b[0] || a[1]!==b[1]){
        poly = poly.slice();
        poly.push([a[0], a[1]]);
      }
      return poly;
    }

    function saveCurrentPoly(poly){
      poly = enforceClosedPoly(poly);
      // clamp and normalize
      poly = poly.map(p=>[clamp(+p[0],0,1), clamp(+p[1],0,1)]);
      setPolyOverride(poly);
      applyPolyOverrideToCurrentTrack();
      // Persist into custom track too if we're on custom
      if (G && G.trackPresetId==='custom'){
        try{ localStorage.setItem(TRACK_CUSTOM_KEY, JSON.stringify(G.track)); }catch(e){}
      }
      renderTrack();
    }

    function defaultPolyForCurrentPreset(){
      const pid = (G && G.trackPresetId) || 'custom';
      const preset = TRACK_LIBRARY.find(x=>x.id===pid);
      const base = preset?.track?.mapPoly || DEFAULT_TRACK.mapPoly;
      return deepClone(base || []);
    }

    if (btnPathEdit){
      btnPathEdit.addEventListener('click', ()=> setPathEdit(!mapEditEnabled));
    }
    if (btnPathReset){
      btnPathReset.addEventListener('click', ()=> {
        const poly = defaultPolyForCurrentPreset();
        // remove override record
        setPolyOverride(null);
        if (G && G.track){
          G.track.mapPoly = poly;
          if (G.trackPresetId==='custom'){
            try{ localStorage.setItem(TRACK_CUSTOM_KEY, JSON.stringify(G.track)); }catch(e){}
          }
        }
        renderTrack();
      });
    }

    function eventToNorm(e){
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      return [clamp(x,0,1), clamp(y,0,1), rect];
    }

    function nearestPointIndex(poly, x, y){
      let best=-1, bestD=1e9;
      for (let i=0;i<poly.length;i++){
        const dx = poly[i][0]-x, dy = poly[i][1]-y;
        const d = dx*dx + dy*dy;
        if (d < bestD){ bestD=d; best=i; }
      }
      return {idx:best, d2:bestD};
    }

    function insertPointOnNearestSegment(poly, x, y){
      // find nearest segment (i..i+1)
      let bestSeg=0, bestD=1e9, bestT=0;
      for (let i=0;i<poly.length-1;i++){
        const ax=poly[i][0], ay=poly[i][1];
        const bx=poly[i+1][0], by=poly[i+1][1];
        const vx=bx-ax, vy=by-ay;
        const wx=x-ax, wy=y-ay;
        const vv = vx*vx+vy*vy || 1e-9;
        let t = (wx*vx+wy*vy)/vv;
        t = clamp(t,0,1);
        const px = ax + vx*t, py = ay + vy*t;
        const dx=x-px, dy=y-py;
        const d = dx*dx+dy*dy;
        if (d<bestD){ bestD=d; bestSeg=i; bestT=t; }
      }
      // Insert after bestSeg, but avoid inserting between last and first duplicate closure point: insert before last
      const insertAt = Math.min(bestSeg+1, poly.length-1);
      const out = poly.slice(0, insertAt).concat([[x,y]], poly.slice(insertAt));
      return out;
    }

    if (canvas){
      canvas.addEventListener('pointerdown', (e)=>{
        if (!mapEditEnabled) return;
        e.preventDefault();
        canvas.setPointerCapture?.(e.pointerId);
        const [x,y,rect] = eventToNorm(e);
        let poly = deepClone(getPolyOverride() || (G?.track?.mapPoly) || DEFAULT_TRACK.mapPoly || []);
        if (!poly || poly.length<4) poly = defaultPolyForCurrentPreset();
        poly = enforceClosedPoly(poly);

        // Threshold in normalized units based on canvas size
        const threshPx = 18;
        const threshN = threshPx / Math.min(rect.width, rect.height);
        const {idx, d2} = nearestPointIndex(poly, x, y);

        if (e.altKey){
          // delete point (not if would drop below 4, and avoid deleting last closure point)
          if (idx>0 && idx<poly.length-1 && poly.length>5){
            poly.splice(idx,1);
            poly = enforceClosedPoly(poly);
            saveCurrentPoly(poly);
          }
          return;
        }
        if (e.shiftKey){
          // insert point on nearest segment (avoid adding if click is near existing point)
          if (Math.sqrt(d2) > threshN){
            poly = insertPointOnNearestSegment(poly, x, y);
            poly = enforceClosedPoly(poly);
            saveCurrentPoly(poly);
            mapDragIndex = Math.max(0, Math.min(poly.length-2, idx+1));
            mapDragging = true;
          }
          return;
        }

        if (Math.sqrt(d2) <= threshN){
          mapDragIndex = idx;
          mapDragging = true;
        } else {
          mapDragIndex = -1;
          mapDragging = false;
        }
        renderTrack();
      });

      canvas.addEventListener('pointermove', (e)=>{
        if (!mapEditEnabled || !mapDragging || mapDragIndex<0) return;
        e.preventDefault();
        const [x,y] = eventToNorm(e);
        let poly = deepClone(getPolyOverride() || (G?.track?.mapPoly) || defaultPolyForCurrentPreset());
        poly = enforceClosedPoly(poly);
        poly[mapDragIndex] = [x,y];
        // If editing the first point, also move the last closure point.
        if (mapDragIndex===0) poly[poly.length-1] = [x,y];
        // If editing the last closure point, mirror to first.
        if (mapDragIndex===poly.length-1) poly[0] = [x,y];

        // clamp and store without spamming localStorage too hard: store live but ok
        saveCurrentPoly(poly);
      });

      function stopDrag(e){
        if (!mapEditEnabled) return;
        if (mapDragging){
          mapDragging = false;
          mapDragIndex = -1;
          renderTrack();
        }
      }
      canvas.addEventListener('pointerup', stopDrag);
      canvas.addEventListener('pointercancel', stopDrag);
      canvas.addEventListener('pointerleave', stopDrag);
    }

// Background image loader controls (per track). This does NOT bundle copyrighted images.
    const bgFile = $('#trackBgFile');

  function drawGearRing(canvas, gear, maxGear) {
    maxGear = maxGear || 4;
    if (!canvas) return;
    var dpr = window.devicePixelRatio || 1;
    canvas.width  = 44 * dpr;
    canvas.height = 44 * dpr;
    var ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    var cx = 22, cy = 22, r = 17, lw = 4;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,200,120,.12)'; ctx.lineWidth=lw; ctx.stroke();
    var frac=gear/maxGear, start=-Math.PI/2, end=start+frac*Math.PI*2;
    var gc=['','#4be8a0','#e8b84b','#e8904b','#e84b3a'];
    ctx.beginPath(); ctx.arc(cx,cy,r,start,end);
    ctx.strokeStyle=gc[gear]||'#e8b84b'; ctx.lineWidth=lw; ctx.lineCap='round'; ctx.stroke();
  }

  function renderHeatPips(engineLen, maxPips) {
    maxPips = maxPips || 8;
    var html = '';
    for (var i=0; i<maxPips; i++) {
      var filled = i < engineLen;
      var hot = engineLen >= maxPips-1 && filled;
      html += '<div class="heat-pip' + (filled ? (hot ? ' hot' : ' filled') : '') + '"></div>';
    }
    return '<div class="heat-pips">' + html + '</div>';
  }

  function contrastColor(hex) {
    if (!hex || hex.length < 4) return '#000';
    var r=parseInt(hex.slice(1,3),16)||0, g=parseInt(hex.slice(3,5),16)||0, b=parseInt(hex.slice(5,7),16)||0;
    return (r*0.299+g*0.587+b*0.114)>150 ? '#111' : '#fff';
  }

    if (c.type==='sponsor') return base+'/sponsor_generic.png';
    return null;
  }

  function renderSetupLaunchPad(){
    return '<div class="pane setup-launch"><div class="pane-hd">Race Setup</div><div class="pane-bd">'
      +'<div class="note">Use the setup wizard to configure track, players, and modules before the race begins.</div>'

  function hookSetupLaunchPad(){
    var btn = $('#btnOpenSetupWizard');
    if (btn) btn.addEventListener('click', function(){ openSetupWizard(false); });
  }

  function applySetupWizardPage(page){
    var modalBody = $('#modalBody');
    if (!modalBody) return;
    var pages = Array.from(modalBody.querySelectorAll('.wizard-page'));
    setupWizardPage = Math.max(0, Math.min(page, pages.length-1));
    pages.forEach(function(el, idx){ el.style.display = idx===setupWizardPage ? '' : 'none'; });
    Array.from(modalBody.querySelectorAll('.setup-wizard-step')).forEach(function(el, idx){ el.classList.toggle('active', idx===setupWizardPage); });
    var prev = $('#wizPrev'), next = $('#wizNext');
    if (prev) prev.disabled = setupWizardPage===0;
    if (next) { next.style.display = setupWizardPage===pages.length-1 ? 'none' : ''; next.textContent = setupWizardPage===pages.length-2 ? 'Review & Start' : 'Next'; }
  }

  function hookSetupWizardModal(){
    var modalBody = $('#modalBody');
    if (!modalBody) return;
    var nav = document.createElement('div');
    nav.className = 'setup-wizard-nav';
    nav.innerHTML = '<div class="setup-wizard-step active">1. Track</div><div class="setup-wizard-step">2. Drivers</div><div class="setup-wizard-step">3. Modules & Start</div>';
    var controls = document.createElement('div');
    controls.className = 'setup-wizard-controls';
    controls.innerHTML = '<button class="btn" id="wizPrev">Back</button><button class="btn primary" id="wizNext">Next</button>';
    modalBody.prepend(nav);
    modalBody.appendChild(controls);
    var prev = $('#wizPrev'), next = $('#wizNext');
    if (prev) prev.addEventListener('click', function(){ applySetupWizardPage(setupWizardPage-1); });
    if (next) next.addEventListener('click', function(){ applySetupWizardPage(setupWizardPage+1); });
    Array.from(modalBody.querySelectorAll('.setup-wizard-step')).forEach(function(stepEl, idx){ stepEl.addEventListener('click', function(){ applySetupWizardPage(idx); }); });
    applySetupWizardPage(setupWizardPage||0);
  }

  function openSetupWizard(resetPage){
    if (resetPage !== false) setupWizardPage = 0;
    openModal('Race Setup', '<div class="setup-wizard-tip">Walk through track, drivers, and modules before you initialize the race.</div>'+renderSetupWizardUI(), 'Step-by-step wizard');
    hookSetupUI();
    hookSetupWizardModal();
  }

  function currentDesignPhase(){
    if (G.phase === PHASE.RESOLUTION){
      if (G.activeStep === STEP.CHECK_CORNER) return 'corner';
      return 'resolution';
    }
    if (G.phase === PHASE.PLANNING) return 'planning';
    if (G.phase === PHASE.FINISHED) return 'finished';
    return 'planning';
  }

  function renderStandingsDock(){
    if (!G || !G.players.length) return '';
    var sorted=sortedCars(true,true);
    var rows=sorted.map(function(p,i){
      var isFin=p.finished;
      return '<div class="standing-row'+(isFin?' finished':'')+'">'
        +'<span class="standing-pos">'+(isFin?'✓':(i+1))+'</span>'
        +'<div class="standing-swatch" style="background:'+p.color+';border-radius:99px"></div>'
        +'<span class="standing-name">'+escapeHtml(p.name)+'</span>'
        +'<span class="standing-meta">L'+p.lap+(isFin?' · FIN':' · G'+p.gear)+'</span>'
      +'</div>';
    }).join('');
    return '<div class="dock-pane'+(G.ui&&G.ui.standingsCollapsed?' dock-collapsed':'')+'"><div class="dock-hd"><span>STANDINGS STRIP</span><button class="btn dock-toggle" id="btnToggleStandingsDock">'+((G.ui&&G.ui.standingsCollapsed)?'Expand':'Collapse')+'</button></div><div class="dock-bd"><div class="standings-strip">'+rows+'</div></div></div>';
  }

  function renderActionDock(){
    if (!G) return '';
    var phase=currentDesignPhase();
    var tabs=[['planning','Planning'],['resolution','Resolution'],['corner','Corner check'],['finished','Finished']].map(function(x){
      return '<div class="phase-tab '+(phase===x[0]?'active '+x[0]:'')+'">'+x[1]+'</div>';
    }).join('');
    var buttons='';
    if (G.phase===PHASE.PLANNING){
      buttons='<div class="action-buttons"><button class="btn success cta" id="dockBtnLock">Confirm Play</button></div>';
    } else if (G.phase===PHASE.RESOLUTION){
      if (G.activeStep===STEP.SLIPSTREAM){
        buttons='<div class="action-buttons">'+
          '<button class="btn slip-btn cta" id="dockBtnSlip">Slipstream</button>'+
          '<button class="btn cta" id="dockBtnNoSlip">Skip</button></div>';
      } else if (G.activeStep===STEP.DISCARD){
        buttons='<div class="action-buttons">'+
          '<button class="btn danger cta" id="dockBtnDiscard">Confirm Discard</button>'+
          '<button class="btn cta" id="dockBtnSkipDiscard">Keep All</button></div>';
      } else {
        buttons='<div class="action-buttons"><button class="btn primary cta" id="dockBtnNext">'+escapeHtml(prettyStep(G.activeStep))+' →</button></div>';
      }
    } else if (G.phase===PHASE.FINISHED){
      buttons='<div class="action-buttons"><button class="btn primary cta" id="dockBtnRestart">Restart Race</button></div>';
    } else {
      buttons='<div class="small muted">Contextual action bar will appear when the race starts.</div>';
    }
    return '<div class="dock-pane action-dock-top'+(actionBarCollapsed?' collapsed':'')+'"><div class="dock-hd"><span>PHASE-AWARE ACTION BAR</span><button class="btn" id="btnToggleActionDock">'+(actionBarCollapsed?'Expand':'Collapse')+'</button></div><div class="dock-bd"><div class="phase-rail">'+tabs+'</div>'+buttons+'</div></div>';
  }

  function hookFooterDocks(){
    var el;
    el = $('#dockBtnLock'); if (el) el.addEventListener('click', function(){ nextStep(); });
    el = $('#dockBtnNext'); if (el) el.addEventListener('click', function(){ nextStep(); });
    el = $('#dockBtnSlip'); if (el) el.addEventListener('click', function(){ var p=activePlayer(); if (!p) return; doSlipstream(p,true); G._slipPending=false; G.activeStep=STEP.CHECK_CORNER; renderAll(); });
    el = $('#dockBtnNoSlip'); if (el) el.addEventListener('click', function(){ var p=activePlayer(); if (!p) return; doSlipstream(p,false); G._slipPending=false; G.activeStep=STEP.CHECK_CORNER; renderAll(); });
    el = $('#dockBtnDiscard'); if (el) el.addEventListener('click', function(){ var p=activePlayer(); if (!p) return; confirmDiscard(p, Array.from(ensureDiscardPickSet())); });
    el = $('#dockBtnSkipDiscard'); if (el) el.addEventListener('click', function(){ var p=activePlayer(); if (!p) return; ensureDiscardPickSet().clear(); confirmDiscard(p, []); });
    el = $('#dockBtnRestart'); if (el) el.addEventListener('click', function(){ newGame(); });
    el = $('#btnToggleActionDock'); if (el) el.addEventListener('click', function(){ actionBarCollapsed = !actionBarCollapsed; renderFooterDocks(); });
    el = $('#btnToggleStandingsDock'); if (el) el.addEventListener('click', function(){ if (!G.ui) G.ui={}; G.ui.standingsCollapsed = !G.ui.standingsCollapsed; renderFooterDocks(); });
    el = $('#btnToggleLogDock'); if (el) el.addEventListener('click', function(){ if (!G.ui) G.ui={}; G.ui.logCollapsed = !G.ui.logCollapsed; renderFooterDocks(); });
  }

  function renderFooterDocks(){
    var s = $('#standingsDock');

  function renderPlanningUI(p){
    if (!p) return '<div class="muted small">\u2014</div>';
    var selected=new Set(p.planned.cards);

    var handHtml=p.hand.map(function(c){
      var disabled=(!cardCanBePlayed(c))||(selected.size>=p.gear&&!selected.has(c.id));
      return renderCardFull(c,selected.has(c.id),disabled);
    }).join('');
    var shiftOptions=[1,2,3,4].map(function(g){
      var delta=g-p.gear, needsHeat=Math.abs(delta)===2;
      return '<option value="'+g+'" '+(p.gear===g?'selected':'')+'>'+(needsHeat?'Gear '+g+' (\u22121 Heat)':'Gear '+g)+'</option>';
    }).join('');
    return renderPlayerHUD(p)
      +'<div class="pane"><div class="pane-hd">Plan Turn'
        +'<div class="row" style="gap:6px">'
          +'<span class="tag gold-tag">Select '+p.gear+' card'+(p.gear!==1?'s':'')+'</span>'
          +'<span class="tag" id="selCountWrap"><span id="selCount">'+selected.size+'</span> / '+p.gear+' chosen</span>'
        +'</div></div>'
        +'<div class="pane-bd" style="display:flex;flex-direction:column;gap:10px">'
          +'<div class="row between">'
            +'<label style="flex:1">Gear shift<select id="gearSel" style="margin-top:4px">'+shiftOptions+'</select></label>'
            +'<div class="stat-tile" style="text-align:center"><div class="label">DECK</div>'
              +'<div class="value" style="font-size:16px"><span style="color:var(--cool)">'+p.deck.length+'</span> <span class="muted">/</span> <span style="color:var(--warn)">'+p.discard.length+'</span></div>'
            +'</div>'
          +'</div>'
          +'<div class="right-compact-cards"><div class="small muted" style="margin-bottom:6px">Hand ('+p.hand.length+' \u00b7 playable '+playableCount+')</div>'
            +'<div class="hand" id="hand">'+handHtml+'</div>'
          +'</div>'
          +renderUpgradeDetailsFromHand(p.hand)
        +'</div></div>'
      +'<div class="row" style="justify-content:flex-end;margin-top:2px">'
        +'<button class="btn primary cta" id="btnLock">Lock In \u2192</button>'
      +'</div>'
      +'<div class="note tiny muted">Stress (+) flips random Basic 1\u20134 on reveal. Heat cards cannot be played.</div>';
  }

  function renderResolutionUI(p){
    if (!p) return '<div class="muted small">\u2014</div>';
    var step=G.activeStep;
    var playArea=p.play.length
      ? '<div class="row" style="gap:4px;flex-wrap:wrap;margin-top:4px">'+p.play.map(function(c){return '<span class="tag gold-tag">'+escapeHtml(fmtCard(c))+'</span>';}).join('')+'</div>'
      : '';
    var handHtml=p.hand.map(function(c){
      var disc=step===STEP.DISCARD, disabled=disc?isNonDiscardable(c):!cardCanBePlayed(c);
      return renderCardFull(c,disc&&ensureDiscardPickSet().has(c.id),disabled);
    }).join('');
    var controls='';
    var pc=G.pendingChoice, needsBrake=(pc&&pc.kind==='brake'&&pc.pid===p.id);

    if (step===STEP.REVEAL_MOVE){
      var brakeHtml='';
      if (needsBrake){
        brakeHtml='<div class="note"><div class="small bold" style="margin-bottom:6px">Brakes \u2014 Choose speed for '+escapeHtml(pc.label)+'</div>'
          +'<div class="small muted">Base speed: '+pc.baseSpeed+'</div>'
          +'<div class="row" style="gap:6px;flex-wrap:wrap;margin-top:8px">'
          +pc.choices.map(function(v){return '<button class="btn cta" data-act="brakeChoice" data-val="'+v+'" style="flex:1">'+v+' <span class="muted">(\u2192'+(pc.baseSpeed+v)+')</span></button>';}).join('')
          +'</div></div>';
      }
      controls='<div class="pane"><div class="pane-hd">Reveal &amp; Move</div>'
        +'<div class="pane-bd" style="display:flex;flex-direction:column;gap:8px">'
          +'<div class="small muted">Reveal cards, resolve Stress/+ symbols, choose variable speed, then move.</div>'
          +brakeHtml
          +'<button class="btn primary cta" id="btnNext" '+(needsBrake?'disabled':'')+'>Reveal &amp; Move \u2192</button>'
        +'</div></div>';
    } else if (step===STEP.ADRENALINE){
      var elig=G.adrenaline.eligible;
      controls='<div class="pane"><div class="pane-hd">Adrenaline '+(elig?'<span class="tag cool-tag">Eligible</span>':'<span class="tag">Not eligible</span>')+'</div>'
        +'<div class="pane-bd" style="display:flex;flex-direction:column;gap:8px">'
          +'<div class="small muted">Last car(s) to move may take optional bonuses.</div>'
          +(elig?'<div class="row" style="gap:12px">'
            +'<label class="row small" style="gap:6px;flex-direction:row"><input type="checkbox" id="adrenMove" '+(G.adrenaline.move?'checked':'')+' /> +1 Speed &amp; Move 1</label>'
            +'<label class="row small" style="gap:6px;flex-direction:row"><input type="checkbox" id="adrenCool" '+(G.adrenaline.cooldownBonus?'checked':'')+' /> +1 Cooldown</label>'
            +'</div>':'')
          +'<button class="btn primary cta" id="btnNext">Continue \u2192</button>'
        +'</div></div>';
    } else if (step===STEP.REACT){
      if (!p._reactActions) buildReactActions(p);
      var a=currentReactAction(p);
      var cap=cooldownCapacity(p);
      var heatIH=p.hand.filter(function(c){return c.type==='heat';}).length;
      var stressIH=p.hand.filter(function(c){return c.type==='stress';}).length;
      var canBoost=!p.boostUsed&&p.engine.length>0;
      var aUI='';
      if (a){
        var cl=escapeHtml(a.cardLabel);
        if (a.type==='scrap'){
          aUI='<div class="note"><div class="small bold">'+cl+' \u2014 Scrap '+a.val+'</div>'
            +'<div class="small muted" style="margin-top:4px">Discard '+a.val+' card(s) from top of draw deck.</div>'
            +'<div class="row" style="margin-top:8px"><button class="btn success cta" id="btnActApply">Resolve</button><button class="btn" id="btnActSkip">Skip</button></div></div>';
        } else if (a.type==='upgCooldown'){
          aUI='<div class="note"><div class="small bold">'+cl+' \u2014 Cooldown \u2264'+a.val+'</div>'
            +'<input id="actNum" type="number" min="0" max="'+Math.min(a.val,heatIH)+'" value="'+Math.min(a.val,heatIH)+'" />'
            +'<div class="row" style="margin-top:8px"><button class="btn success cta" id="btnActApply">Apply</button><button class="btn" id="btnActSkip">Skip</button></div></div>';
        } else if (a.type==='reduceStress'){
          aUI='<div class="note"><div class="small bold">'+cl+' \u2014 Remove Stress \u2264'+a.val+'</div>'
            +'<input id="actNum" type="number" min="0" max="'+Math.min(a.val,stressIH)+'" value="'+Math.min(a.val,stressIH)+'" />'
            +'<div class="row" style="margin-top:8px"><button class="btn success cta" id="btnActApply">Apply</button><button class="btn" id="btnActSkip">Skip</button></div></div>';
        } else if (a.type==='salvage'){
          var dopts=p.discard.slice(-6).map(function(c){return '<label class="row small" style="gap:6px;flex-direction:row"><input type="checkbox" class="actPick" value="'+c.id+'" />'+escapeHtml(fmtCard(c))+'</label>';}).join('');
          aUI='<div class="note"><div class="small bold">'+cl+' \u2014 Salvage \u2264'+a.val+'</div>'
            +'<div style="display:flex;flex-direction:column;gap:4px;margin:6px 0">'+dopts+'</div>'
            +'<div class="row"><button class="btn success cta" id="btnActApply">Salvage</button><button class="btn" id="btnActSkip">Skip</button></div></div>';
        } else {
          aUI='<div class="note"><div class="small bold">'+cl+' \u2014 '+a.type+'</div>'
            +'<div class="row" style="margin-top:8px"><button class="btn success cta" id="btnActApply">Apply</button><button class="btn" id="btnActSkip">Skip</button></div></div>';
        }
      } else {
        aUI='<div class="tag cool-tag" style="align-self:flex-start">All upgrade effects resolved</div>';
      }
      controls='<div class="pane"><div class="pane-hd">React Phase</div>'
        +'<div class="pane-bd" style="display:flex;flex-direction:column;gap:8px">'
          +aUI+'<div class="hr"></div>'
          +'<div class="row" style="gap:6px;flex-wrap:wrap">'
            +'<button class="btn success" id="btnCooldown" '+(cap<=0||heatIH<=0?'disabled':'')+'>Cooldown ('+cap+' max)</button>'
            +'<button class="btn" id="btnBoost" '+(canBoost?'':'disabled')+' style="color:var(--warn);border-color:rgba(232,144,75,.4);background:var(--warn2)">Boost</button>'
            +'<button class="btn primary cta" id="btnNext" '+(a?'disabled':'')+'>Finish React \u2192</button>'
          +'</div></div></div>';
    } else if (step===STEP.SLIPSTREAM){
      var slipEl=slipEligible(p);
      controls='<div class="pane"><div class="pane-hd">Slipstream '+(slipEl?'<span class="tag slip-tag">Eligible</span>':'<span class="tag">Not eligible</span>')+'</div>'
        +'<div class="pane-bd" style="display:flex;gap:8px">'
          +(slipEl
            ?'<button class="btn slip-btn cta" id="btnSlip" style="flex:1">\u26a1 Slipstream +2</button><button class="btn cta" id="btnNoSlip" style="flex:1">Skip</button>'
            :'<button class="btn primary cta" id="btnNext" style="flex:1">Continue \u2192</button>')
        +'</div></div>';
    } else if (step===STEP.CHECK_CORNER){
      var clist=G.cornerCrossed||[];
      controls='<div class="pane"><div class="pane-hd">Corner Check <span class="tag'+(clist.length?' heat-tag':'')+'">'+clist.length+' corner(s)</span></div>'
        +'<div class="pane-bd" style="display:flex;flex-direction:column;gap:6px">'
          +'<div class="small muted">Speed: <strong>'+G.speedForCorner+'</strong></div>'
          +clist.map(function(c){return '<div class="note small">Corner @'+c.cornerLineIndex+' \u00b7 Limit \u2264'+c.speedLimit+'</div>';}).join('')
          +'<button class="btn primary cta" id="btnNext">Check Corners \u2192</button>'
        +'</div></div>';
    } else if (step===STEP.DISCARD){
      var picks=ensureDiscardPickSet();
      controls='<div class="pane"><div class="pane-hd">Discard (optional) <span class="tag">'+picks.size+' selected</span></div>'
        +'<div class="pane-bd" style="display:flex;gap:8px">'
          +'<button class="btn danger cta" id="btnConfirmDiscard" style="flex:1">Discard '+picks.size+'</button>'
          +'<button class="btn cta" id="btnSkipDiscard" style="flex:1">Keep All</button>'
        +'</div></div>';
    } else {
      controls='<div class="pane"><div class="pane-hd">Replenish</div>'
        +'<div class="pane-bd"><button class="btn primary cta" id="btnNext" style="width:100%">Replenish &amp; Next \u2192</button></div></div>';
    }

    return renderPlayerHUD(p)+renderStepProgress(step)
      +(playArea?'<div class="note small" style="display:flex;flex-direction:column;gap:4px"><span class="muted tiny">PLAYED</span>'+playArea+'</div>':'')
      +controls
      +(p.hand.length?'<div class="pane"><div class="pane-hd">Hand ('+p.hand.length+')</div><div class="pane-bd"><div class="hand" id="hand">'+handHtml+'</div></div></div>':'');
  }

  function renderFinishedUI(){
    var medals=['\ud83e\udd47','\ud83e\udd48','\ud83e\udd49'];
    var order=G.finishedOrder.map(function(id,idx){
      var p=G.players.find(function(x){return x.id===id;});
      return '<div class="standing-row">'
        +'<span class="standing-pos">'+(medals[idx]||'#'+(idx+1))+'</span>'
        +'<div class="standing-swatch" style="background:'+(p&&p.color||'#888')+'"></div>'
        +'<span class="standing-name">'+escapeHtml((p&&p.name)||'?')+'</span>'
      +'</div>';
    }).join('');
    var champBlock='';
    if (G.modules.championship&&G.champ){
      var rows=champStandings().map(function(p,i){
        return '<tr><td>'+(i+1)+'</td><td>'+escapeHtml(p.name)+'</td><td>'+((p.champ&&p.champ.points)||0)+'</td></tr>';
      }).join('');
      champBlock='<div class="pane"><div class="pane-hd">Championship Standings <span class="tag gold-tag">Race '+(G.champ.raceIndex+1)+'/'+G.champ.racesTotal+'</span></div>'
        +'<div class="pane-bd"><table class="tbl"><thead><tr><th>#</th><th>Driver</th><th>Pts</th></tr></thead><tbody>'+rows+'</tbody></table>'
        +'<button class="btn primary cta" id="btnNextRace" style="width:100%;margin-top:10px">'
          +((G.champ.raceIndex+1<G.champ.racesTotal)?'Next Race \u2192':'End Championship')
        +'</button></div></div>';
    }
    return '<div class="pane"><div class="pane-hd" style="color:var(--gold)">Race Finished! \ud83c\udfc1</div>'
      +'<div class="pane-bd"><div class="standings">'+(order||'<div class="muted small">\u2014</div>')+'</div></div></div>'
      +champBlock
      +'<div class="row" style="gap:8px;justify-content:flex-end">'
        +'<button class="btn primary cta" id="btnRestart">Restart Race</button>'
        +'<button class="btn" id="btnBackSetup">Back to Setup</button>'
      +'</div>';
  }



  /***********************
   * Init
   ***********************/
  function hookVerticalViewportSplitter(){
    var splitter = $('#footerSplitter');
    var trackPanel = $('#trackPanel');
    var trackView = $('#trackView');
    if (!splitter || !trackPanel || !trackView) return;
    var dragging = false;
    var startY = 0;
    var startHeight = 0;
    function clientYOf(e){ return e.touches ? e.touches[0].clientY : e.clientY; }
    function start(e){
      dragging = true;
      startY = clientYOf(e);
      startHeight = trackView.getBoundingClientRect().height;
      splitter.classList.add('dragging');
      e.preventDefault();
    }
    function move(e){
      if (!dragging) return;
      var rect = trackPanel.getBoundingClientRect();
      var toolbarH = ($('#trackToolbar')?.offsetHeight || 0) + ($('#actionDockWrap')?.offsetHeight || 0) + splitter.offsetHeight;
      var minView = 220;
      var maxView = Math.max(minView, rect.height - toolbarH - 80);
      var delta = clientYOf(e) - startY;
      var desired = Math.max(minView, Math.min(maxView, startHeight + delta));
      trackView.style.flex = '0 0 ' + desired + 'px';
      trackView.style.height = desired + 'px';
      e.preventDefault();
    }
    function end(){ dragging = false; splitter.classList.remove('dragging'); }
    splitter.addEventListener('mousedown', start);
    splitter.addEventListener('touchstart', start, {passive:false});
    window.addEventListener('mousemove', move);
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('mouseup', end);
    window.addEventListener('touchend', end);
  }

  function hookPanelSplitter(){
    var splitter = $('#panelSplitter');
    var app = $('#app');
    if (!splitter || !app) return;
    var dragging = false;
    function clientXOf(e){ return e.touches ? e.touches[0].clientX : e.clientX; }
    function start(e){ dragging = true; splitter.classList.add('dragging'); e.preventDefault(); }
    function move(e){
      if (!dragging) return;
      var rect = app.getBoundingClientRect();
      var rightW = Math.max(300, Math.min(520, rect.right - clientXOf(e)));
      app.style.gridTemplateColumns = 'minmax(0,1fr) 8px '+rightW+'px';
      e.preventDefault();
    }
    function end(){ dragging = false; splitter.classList.remove('dragging'); }
    splitter.addEventListener('mousedown', start);
    splitter.addEventListener('touchstart', start, {passive:false});
    window.addEventListener('mousemove', move);
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('mouseup', end);
    window.addEventListener('touchend', end);
  }

  loadBgStore();
    loadPolyStore();
  hookHeader();
  hookPanelSplitter();
  hookVerticalViewportSplitter();
  updateBgUI();
  newGame();

})();

</script>
